ad_parameter.insertion_text:
  data_type: STRING
  description: '<p>Numeric value to insert into the ad text. The following restrictions

    apply:</p>

    <ul>

    <li>

    <p>Can use comma or period as a separator, with an optional period or

    comma (respectively) for fractional values. For example, 1,000,000.00

    and 2.000.000,10 are valid.</p>

    </li>

    <li>

    <p>Can be prepended or appended with a currency symbol. For example,

    $99.99 is valid.</p>

    </li>

    <li>

    <p>Can be prepended or appended with a currency code. For example, 99.99USD

    and EUR200 are valid.</p>

    </li>

    <li>

    <p>Can use ''%''. For example, 1.0% and 1,0% are valid.</p>

    </li>

    <li>Can use plus or minus. For example, -10.99 and 25+ are valid.</li>

    <li>Can use ''/'' between two numbers. For example 4/1 and 0.95/0.45 are

    valid.</li>

    </ul>'
  filterable: true
  is_repeated: false
  sortable: true
