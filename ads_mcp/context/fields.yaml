  enum_values: AD_GROUP, AD_GROUP_CRITERION, CAMPAIGN_BIDDING_STRATEGY, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
ad_group.exclude_demographic_expansion:
  data_type: BOOLEAN
  description: '<p>When this value is true, demographics will be excluded from the
    types of

    targeting which are expanded when optimized_targeting_enabled is true.

    When optimized_targeting_enabled is false, this field is ignored. Default

    is false.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.excluded_parent_asset_field_types:
  data_type: ENUM
  description: '<p>The asset field types that should be excluded from this ad group.
    Asset

    links with these field types will not be inherited by this ad group from

    the upper levels.</p>'
  enum_values: AD_IMAGE, BOOK_ON_GOOGLE, BUSINESS_LOGO, BUSINESS_MESSAGE, BUSINESS_NAME,
    CALL, CALLOUT, CALL_TO_ACTION, CALL_TO_ACTION_SELECTION, CLASSIC_DISPLAY_IMAGE,
    DEMAND_GEN_CAROUSEL_CARD, DESCRIPTION, HEADLINE, HOTEL_CALLOUT, HOTEL_PROPERTY,
    LANDING_PAGE_PREVIEW, LANDSCAPE_LOGO, LEAD_FORM, LOGO, LONG_DESCRIPTION, LONG_HEADLINE,
    MANDATORY_AD_TEXT, MARKETING_IMAGE, MEDIA_BUNDLE, MOBILE_APP, PORTRAIT_MARKETING_IMAGE,
    PRICE, PROMOTION, RELATED_YOUTUBE_VIDEOS, SITELINK, SQUARE_MARKETING_IMAGE, STRUCTURED_SNIPPET,
    TALL_PORTRAIT_MARKETING_IMAGE, UNKNOWN, UNSPECIFIED, VIDEO, YOUTUBE_VIDEO
  filterable: true
  is_repeated: true
  sortable: false
ad_group.excluded_parent_asset_set_types:
  data_type: ENUM
  description: '<p>The asset set types that should be excluded from this ad group.
    Asset set

    links with these types will not be inherited by this ad group from the

    upper levels.

    Location group types (GMB_DYNAMIC_LOCATION_GROUP,

    CHAIN_DYNAMIC_LOCATION_GROUP, and STATIC_LOCATION_GROUP) are child types of

    LOCATION_SYNC. Therefore, if LOCATION_SYNC is set for this field, all

    location group asset sets are not allowed to be linked to this ad group,

    and all Location Extension (LE) and Affiliate Location Extensions (ALE)

    will not be served under this ad group.

    Only LOCATION_SYNC is currently supported.</p>'
  enum_values: BUSINESS_PROFILE_DYNAMIC_LOCATION_GROUP, CHAIN_DYNAMIC_LOCATION_GROUP,
    DYNAMIC_CUSTOM, DYNAMIC_EDUCATION, DYNAMIC_FLIGHTS, DYNAMIC_HOTELS_AND_RENTALS,
    DYNAMIC_JOBS, DYNAMIC_LOCAL, DYNAMIC_REAL_ESTATE, DYNAMIC_TRAVEL, HOTEL_PROPERTY,
    LOCATION_SYNC, MERCHANT_CENTER_FEED, PAGE_FEED, STATIC_LOCATION_GROUP, TRAVEL_FEED,
    UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: true
  sortable: false
ad_group.final_url_suffix:
  data_type: STRING
  description: <p>URL template for appending params to Final URL.</p>
  filterable: true
  is_repeated: false
  sortable: true
ad_group.fixed_cpm_micros:
  data_type: INT64
  description: '<p>The fixed amount in micros that the advertiser pays for every thousand

    impressions of the ad.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.id:
  data_type: INT64
  description: <p>Output only. The ID of the ad group.</p>
  filterable: true
  is_repeated: false
  sortable: true
ad_group.labels:
  data_type: RESOURCE_NAME
  description: <p>Output only. The resource names of labels attached to this ad group.</p>
  filterable: true
  is_repeated: true
  sortable: false
ad_group.name:
  data_type: STRING
  description: '<p>The name of the ad group.</p>

    <p>This field is required and should not be empty when creating new ad

    groups.</p>

    <p>It must contain fewer than 255 UTF-8 full-width characters.</p>

    <p>It must not contain any null (code point 0x0), NL line feed

    (code point 0xA) or carriage return (code point 0xD) characters.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.optimized_targeting_enabled:
  data_type: BOOLEAN
  description: '<p>True if optimized targeting is enabled. Optimized Targeting is
    the

    replacement for Audience Expansion.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.percent_cpc_bid_micros:
  data_type: INT64
  description: '<p>The percent cpc bid amount, expressed as a fraction of the advertised
    price

    for some good or service. The valid range for the fraction is [0,1) and the

    value stored here is 1,000,000 * [fraction].</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.primary_status:
  data_type: ENUM
  description: '<p>Output only. Provides aggregated view into why an ad group is not
    serving

    or not serving optimally.</p>'
  enum_values: ELIGIBLE, LIMITED, NOT_ELIGIBLE, PAUSED, PENDING, REMOVED, UNKNOWN,
    UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
ad_group.primary_status_reasons:
  data_type: ENUM
  description: '<p>Output only. Provides reasons for why an ad group is not serving
    or not

    serving optimally.</p>'
  enum_values: AD_GROUP_ADS_PAUSED, AD_GROUP_INCOMPLETE, AD_GROUP_PAUSED, AD_GROUP_PAUSED_DUE_TO_LOW_ACTIVITY,
    AD_GROUP_REMOVED, CAMPAIGN_DRAFT, CAMPAIGN_ENDED, CAMPAIGN_PAUSED, CAMPAIGN_PENDING,
    CAMPAIGN_REMOVED, HAS_ADS_DISAPPROVED, HAS_ADS_LIMITED_BY_POLICY, KEYWORDS_PAUSED,
    MOST_ADS_UNDER_REVIEW, NO_AD_GROUP_ADS, NO_KEYWORDS, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: true
  sortable: false
