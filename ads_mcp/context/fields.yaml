campaign_budget.aligned_bidding_strategy_id:
  data_type: INT64
  description: '<p>ID of the portfolio bidding strategy that this shared campaign
    budget

    is aligned with. When a bidding strategy and a campaign budget are aligned,

    they are attached to the same set of campaigns. After a campaign budget is

    aligned with a bidding strategy, campaigns that are added to the campaign

    budget must also use the aligned bidding strategy.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.amount_micros:
  data_type: INT64
  description: '<p>The average daily amount to be spent by the campaign.

    This field is used when the CampaignBudget <code>period</code> is set to <code>DAILY</code>,

    which is the default.</p>

    <p>Amount is specified in micros in the account''s local currency.

    One million micros is equivalent to one currency unit.

    The effective monthly spend is capped at 30.4 times this daily amount.</p>

    <p>This field is mutually exclusive with ''total_amount_micros''. Only one

    of ''amount_micros'' or ''total_amount_micros'' should be set.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.delivery_method:
  data_type: ENUM
  description: '<p>The delivery method that determines the rate at which the campaign
    budget

    is spent.</p>

    <p>Defaults to STANDARD if unspecified in a create operation.</p>'
  enum_values: ACCELERATED, STANDARD, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.explicitly_shared:
  data_type: BOOLEAN
  description: '<p>Specifies whether the budget is explicitly shared. Defaults to
    true if

    unspecified in a create operation.</p>

    <p>If true, the budget was created with the purpose of sharing

    across one or more campaigns.</p>

    <p>If false, the budget was created with the intention of only being used

    with a single campaign. The budget''s name and status will stay in sync

    with the campaign''s name and status. Attempting to share the budget with a

    second campaign will result in an error.</p>

    <p>A non-shared budget can become an explicitly shared. The same operation

    must also assign the budget a name.</p>

    <p>A shared campaign budget can never become non-shared.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.has_recommended_budget:
  data_type: BOOLEAN
  description: '<p>Output only. Indicates whether there is a recommended budget for
    this

    campaign budget.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.id:
  data_type: INT64
  description: '<p>Output only. The ID of the campaign budget.</p>

    <p>A campaign budget is created using the CampaignBudgetService create

    operation and is assigned a budget ID. A budget ID can be shared across

    different campaigns; the system will then allocate the campaign budget

    among different campaigns to get optimum results.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.name:
  data_type: STRING
  description: '<p>The name of the campaign budget.</p>

    <p>When creating a campaign budget through CampaignBudgetService, every

    explicitly shared campaign budget must have a non-null, non-empty name.

    Campaign budgets that are not explicitly shared derive their name from the

    attached campaign''s name.</p>

    <p>The length of this string must be between 1 and 255, inclusive,

    in UTF-8 bytes, (trimmed).</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.period:
  data_type: ENUM
  description: '<p>Immutable. Period over which to spend the budget. Defaults to DAILY
    if not

    specified.</p>'
  enum_values: CUSTOM_PERIOD, DAILY, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.recommended_budget_amount_micros:
  data_type: INT64
  description: '<p>Output only. The recommended budget amount. If no recommendation
    is

    available, this will be set to the budget amount. Amount is specified in

    micros, where one million is equivalent to one currency unit.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
campaign_budget.recommended_budget_estimated_change_weekly_clicks:
