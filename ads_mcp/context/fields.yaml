  description: '<p>The data_exclusion will apply to all the campaigns under the listed

    channels retroactively as well as going forward when the scope of this

    exclusion is CHANNEL.

    The supported advertising channel types are DISPLAY, SEARCH and SHOPPING.

    Note: a data exclusion with both advertising_channel_types and

    campaign_ids is not supported.</p>'
  enum_values: DEMAND_GEN, DISPLAY, HOTEL, LOCAL, LOCAL_SERVICES, MULTI_CHANNEL, PERFORMANCE_MAX,
    SEARCH, SHOPPING, SMART, TRAVEL, UNKNOWN, UNSPECIFIED, VIDEO
