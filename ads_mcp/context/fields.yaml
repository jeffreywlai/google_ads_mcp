ad.device_preference:
  data_type: ENUM
  description: '<p>The device preference for the ad. You can only specify a preference
    for

    mobile devices. When this preference is set the ad will be preferred over

    other ads when being displayed on a mobile device. The ad can still be

    displayed on other device types, for example, if no other ads are

    available. If unspecified (no device preference), all devices are targeted.

    This is only supported by some ad types.</p>'
  enum_values: CONNECTED_TV, DESKTOP, MOBILE, OTHER, TABLET, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
