    Ad group resource names have the form:</p>

    <p><code>customers/{customer_id}/adGroups/{ad_group_id}</code></p>'
  filterable: true
  is_repeated: false
  sortable: false
ad_group.status:
  data_type: ENUM
  description: <p>The status of the ad group.</p>
  enum_values: ENABLED, PAUSED, REMOVED, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
ad_group.target_cpa_micros:
  data_type: INT64
  description: '<p>The target CPA (cost-per-acquisition). If the ad group''s campaign

    bidding strategy is TargetCpa or MaximizeConversions (with its target_cpa

    field set), then this field overrides the target CPA specified in the

    campaign''s bidding strategy.

    Otherwise, this value is ignored.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.target_cpc_micros:
  data_type: INT64
  description: '<p>Average amount in micros that the advertiser is willing to pay
    for every ad

    click. Overrides the target CPC configured at the campaign level.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.target_cpm_micros:
  data_type: INT64
  description: '<p>Average amount in micros that the advertiser is willing to pay
    for every

    thousand times the ad is shown.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.target_cpv_micros:
  data_type: INT64
  description: '<p>Average amount in micros that the advertiser is willing to pay
    for every ad

    view.</p>'
  filterable: true
  is_repeated: false
  sortable: true
ad_group.target_roas:
  data_type: DOUBLE
  description: '<p>The target ROAS (return-on-ad-spend) for this ad group.</p>

    <p>This field lets you override the target ROAS specified in the

    campaign''s bidding strategy, but only if the campaign is using a

    standard (not portfolio) <code>TargetRoas</code> strategy or a standard

    <code>MaximizeConversionValue</code> strategy with its <code>target_roas</code>
    field set.</p>

    <p>If the campaign is using a portfolio bidding strategy, this field

    cannot be set and attempting to do so will result in an error.</p>

    <p>For any other bidding strategies, this value is ignored.</p>

    <p>To see the actual target ROAS being used by the ad group, considering

    potential overrides, query the <code>effective_target_roas</code> and

    <code>effective_target_roas_source</code> fields.</p>'
  filterable: true
  is_repeated: false
  sortable: true
