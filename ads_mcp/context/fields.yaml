    You must provide the accent_color if you provide a main_color.</p>'
  filterable: true
  is_repeated: false
  sortable: false
campaign.brand_guidelines.main_color:
  data_type: STRING
  description: '<p>The main brand color, entered as a hex code (e.g., #00ff00). You
    must provide the main_color if you provide an accent_color.</p>'
  filterable: true
  is_repeated: false
  sortable: false
campaign.brand_guidelines.predefined_font_family:
  data_type: STRING
  description: '<p>The brand''s font family. Must be one of the following Google Fonts
    (case sensitive): Open Sans, Roboto, Montserrat, Poppins, Lato, Oswald, Playfair
    Display, Roboto Slab.</p>'
  filterable: true
  is_repeated: false
  sortable: false
campaign.brand_guidelines_enabled:
  data_type: BOOLEAN
  description: '<p>Immutable. Whether Brand Guidelines are enabled for this Campaign.

    Only applicable to Performance Max campaigns. If enabled, business name

    and logo assets must be linked as CampaignAssets instead of

    AssetGroupAssets.</p>

    <p>Writable only at campaign creation. Set to true to enable Brand

    Guidelines when creating a new Performance Max campaign.</p>

    <p>Immutable after creation. This field cannot be modified using standard

    update operations after the campaign has been created.</p>

    <p>For existing campaigns: To enable Brand Guidelines on a campaign after it

    has been created, use the CampaignService.EnablePMaxBrandGuidelines method,

    which is a separate operation. It is not possible to disable Brand

    Guidelines for an existing campaign.</p>

    <p>Incompatible with Travel Goals: This feature is not supported for

    Performance Max campaigns with Travel Goals. Attempting to set this field

    to true for a Travel Goals campaign will result in an error.</p>'
  filterable: true
  is_repeated: false
  sortable: false
