    Network.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
user_list.eligible_for_search:
  data_type: BOOLEAN
  description: <p>Indicates if this user list is eligible for Google Search Network.</p>
  filterable: true
  is_repeated: false
  sortable: true
user_list.id:
  data_type: INT64
  description: <p>Output only. Id of the user list.</p>
  filterable: true
