campaign.ai_max_setting.bundling_required:
  data_type: ENUM
  description: <p>Output only. Search campaigns only. Indicates whether a campaign
    has adopted AI Max before, and is required to have AI Max enabled to adopt campaign-level
    text asset automation and brand list targeting in all API versions.</p>
  enum_values: NOT_REQUIRED, REQUIRED, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
campaign.ai_max_setting.enable_ai_max:
  data_type: BOOLEAN
  description: <p>Controls whether or not AI Max features are served for this campaign.
    Individual AI Max features are enabled or disabled by their respective settings.
    But if enable_ai_max is set to false or cleared, then no AI Max features will
    serve for this campaign, regardless of the other settings. Supported in Search
    and Shopping campaigns. For Search campaigns, Search Term Matching is enabled
    by default when AI Max is enabled, and can be disabled at the ad group level.
    For Shopping campaigns, Text customization is always enabled when AI Max is enabled.</p>
  filterable: true
  is_repeated: false
  sortable: true
