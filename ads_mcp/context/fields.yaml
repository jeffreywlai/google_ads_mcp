bidding_strategy.aligned_campaign_budget_id:
  data_type: INT64
  description: '<p>ID of the campaign budget that this portfolio bidding strategy

    is aligned with. When a portfolio and a campaign budget are aligned, that

    means that they are attached to the same set of campaigns. After a bidding

    strategy is aligned with a campaign budget, campaigns that are added to the

    bidding strategy must also use the aligned campaign budget.</p>'
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.campaign_count:
  data_type: INT64
  description: '<p>Output only. The number of campaigns attached to this bidding strategy.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.currency_code:
  data_type: STRING
  description: '<p>Immutable. The currency used by the bidding strategy (ISO 4217
    three-letter

    code).</p>

    <p>For bidding strategies in manager customers, this currency can be set on

    creation and defaults to the manager customer''s currency. For serving

    customers, this field cannot be set; all strategies in a serving customer

    implicitly use the serving customer''s currency. In all cases the

    effective_currency_code field returns the currency used by the strategy.</p>'
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.effective_currency_code:
  data_type: STRING
  description: '<p>Output only. The currency used by the bidding strategy (ISO 4217

    three-letter code).</p>

    <p>For bidding strategies in manager customers, this is the currency set by

    the advertiser when creating the strategy. For serving customers, this is

    the customer''s currency_code.</p>

    <p>Bidding strategy metrics are reported in this currency.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.enhanced_cpc:
  data_type: MESSAGE
  description: '<p>A bidding strategy that raises bids for clicks that seem more likely
    to

    lead to a conversion and lowers them for clicks where they seem less

    likely.</p>'
  filterable: false
  is_repeated: false
  sortable: false
bidding_strategy.id:
  data_type: INT64
  description: <p>Output only. The ID of the bidding strategy.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversion_value.cpc_bid_ceiling_micros:
  data_type: INT64
  description: <p>Maximum bid limit that can be set by the bid strategy. The limit
    applies to all keywords managed by the strategy. Mutable for portfolio bidding
    strategies only.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversion_value.cpc_bid_floor_micros:
  data_type: INT64
  description: <p>Minimum bid limit that can be set by the bid strategy. The limit
    applies to all keywords managed by the strategy. Mutable for portfolio bidding
    strategies only.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversion_value.target_roas:
  data_type: DOUBLE
  description: <p>The target return on ad spend (ROAS) option. If set, the bid strategy
    will maximize revenue while averaging the target return on ad spend. If the target
    ROAS is high, the bid strategy may not be able to spend the full budget. If the
    target ROAS is not set, the bid strategy will aim to achieve the highest possible
    ROAS for the budget.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversion_value.target_roas_tolerance_percent_millis:
  data_type: INT64
  description: <p>The percent of ROAS(return on advertising spend) degradation tolerance
    allowed to increase traffic diversity and conversion volume, specified in millis
    (for example, 10,000 = 10%). A value of 10,000 means that the advertiser can expect
    ROAS degradation of up to 10% of the specified target ROAS.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversions.cpc_bid_ceiling_micros:
  data_type: INT64
  description: <p>Maximum bid limit that can be set by the bid strategy. The limit
    applies to all keywords managed by the strategy. Mutable for portfolio bidding
    strategies only.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversions.cpc_bid_floor_micros:
  data_type: INT64
  description: <p>Minimum bid limit that can be set by the bid strategy. The limit
    applies to all keywords managed by the strategy. Mutable for portfolio bidding
    strategies only.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.maximize_conversions.target_cpa_micros:
  data_type: INT64
  description: <p>The target cost-per-action (CPA) option. This is the average amount
    that you would like to spend per conversion action specified in micro units of
    the bidding strategy's currency. If set, the bid strategy will get as many conversions
    as possible at or below the target cost-per-action. If the target CPA is not set,
    the bid strategy will aim to achieve the lowest possible CPA given the budget.</p>
  filterable: true
  is_repeated: false
  sortable: true
bidding_strategy.name:
  data_type: STRING
  description: '<p>The name of the bidding strategy.

    All bidding strategies within an account must be named distinctly.</p>

    <p>The length of this string should be between 1 and 255, inclusive,

    in UTF-8 bytes, (trimmed).</p>'
  filterable: true
  is_repeated: false
  sortable: true
