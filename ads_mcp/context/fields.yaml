    access to

    the list. The reason can be SHARED, OWNED, LICENSED or SUBSCRIBED.</p>

    <p>This field is read-only.</p>'
  enum_values: AFFILIATED, LICENSED, OWNED, SHARED, SUBSCRIBED, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.account_user_list_status:
  data_type: ENUM
  description: '<p>Indicates if this share is still enabled. When a UserList is shared
    with

    the user this field is set to ENABLED. Later the userList owner can decide

    to revoke the share and make it DISABLED.

    The default value of this field is set to ENABLED.</p>'
  enum_values: DISABLED, ENABLED, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
