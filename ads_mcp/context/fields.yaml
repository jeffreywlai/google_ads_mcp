    set. Read

    only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
shared_set.resource_name:
  data_type: RESOURCE_NAME
  description: '<p>Immutable. The resource name of the shared set.

    Shared set resource names have the form:</p>

    <p><code>customers/{customer_id}/sharedSets/{shared_set_id}</code></p>'
  filterable: true
  is_repeated: false
  sortable: false
shared_set.status:
