  is_repeated: false
  sortable: true
campaign.demand_gen_campaign_settings.upgraded_targeting:
  data_type: BOOLEAN
  description: <p>Immutable. Specifies whether this campaign uses upgraded targeting
    options. When this field is set to <code>true</code>, you can use location and
    language targeting at the ad group level as opposed to the standard campaign-level
    targeting. This field defaults to <code>true</code>, and can only be set when
    creating a campaign.</p>
  filterable: true
  is_repeated: false
  sortable: true
campaign.dynamic_search_ads_setting.domain_name:
