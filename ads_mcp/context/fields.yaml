  filterable: false
  is_repeated: true
  sortable: false
user_list.closing_reason:
  data_type: ENUM
  description: '<p>Indicating the reason why this user list membership status is closed.
    It is

    only populated on lists that were automatically closed due to inactivity,

    and will be cleared once the list membership status becomes open.</p>'
  enum_values: UNKNOWN, UNSPECIFIED, UNUSED
  filterable: true
  is_repeated: false
  sortable: true
user_list.crm_based_user_list.app_id:
  data_type: STRING
  description: <p>A string that uniquely identifies a mobile application from which
    the data was collected. For iOS, the ID string is the 9 digit string that appears
    at the end of an App Store URL (for example, "476943146" for "Flood-It! 2" whose
    App Store link is <a href="http://itunes.apple.com/us/app/flood-it!-2/id476943146">http://itunes.apple.com/us/app/flood-it!-2/id476943146</a>).
    For Android, the ID string is the application's package name (for example, "com.labpixies.colordrips"
    for "Color Drips" given Google Play link <a href="https://play.google.com/store/apps/details?id=com.labpixies.colordrips">https://play.google.com/store/apps/details?id=com.labpixies.colordrips</a>).
    Required when creating CrmBasedUserList for uploading mobile advertising IDs.</p>
  filterable: true
  is_repeated: false
  sortable: true
user_list.crm_based_user_list.data_source_type:
  data_type: ENUM
  description: <p>Data source of the list. Default value is FIRST_PARTY. Only customers
    on the allow-list can create third-party sourced CRM lists.</p>
  enum_values: FIRST_PARTY, THIRD_PARTY_CREDIT_BUREAU, THIRD_PARTY_PARTNER_DATA, THIRD_PARTY_VOTER_FILE,
    UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.crm_based_user_list.upload_key_type:
  data_type: ENUM
  description: <p>Matching key type of the list. Mixed data types are not allowed
    on the same list. This field is required for an ADD operation.</p>
  enum_values: CONTACT_INFO, CRM_ID, MOBILE_ADVERTISING_ID, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.description:
  data_type: STRING
  description: <p>Description of this user list.</p>
  filterable: true
  is_repeated: false
  sortable: true
