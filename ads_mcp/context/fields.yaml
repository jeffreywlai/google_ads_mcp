  sortable: true
campaign.maximize_conversion_value.target_roas_tolerance_percent_millis:
  data_type: INT64
  description: <p>The percent of ROAS(return on advertising spend) degradation tolerance
    allowed to increase traffic diversity and conversion volume, specified in millis
    (for example, 10,000 = 10%). A value of 10,000 means that the advertiser can expect
    ROAS degradation of up to 10% of the specified target ROAS.</p>
  filterable: true
  is_repeated: false
  sortable: true
campaign.maximize_conversions.target_cpa_micros:
  data_type: INT64
  description: <p>The target cost-per-action (CPA) option. This is the average amount
    that you would like to spend per conversion action specified in micro units of
    the bidding strategy's currency. If set, the bid strategy will get as many conversions
    as possible at or below the target cost-per-action. If the target CPA is not set,
    the bid strategy will aim to achieve the lowest possible CPA given the budget.</p>
  filterable: true
  is_repeated: false
  sortable: true
