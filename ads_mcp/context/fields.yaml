    defined by ISO-3166</p>
  filterable: true
  is_repeated: true
  sortable: false
user_list.lookalike_user_list.expansion_level:
  data_type: ENUM
  description: <p>Expansion level, reflecting the size of the lookalike audience</p>
  enum_values: BALANCED, BROAD, NARROW, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.lookalike_user_list.seed_user_list_ids:
  data_type: INT64
  description: <p>Seed UserList ID from which this list is derived, provided by user.</p>
  filterable: true
  is_repeated: true
  sortable: false
user_list.match_rate_percentage:
  data_type: INT32
  description: '<p>Output only. Indicates match rate for Customer Match lists. The
    range of

    this field is [0-100]. This will be null for other list types or when it''s

    not possible to calculate the match rate.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
user_list.membership_life_span:
  data_type: INT64
  description: '<p>Number of days a user''s cookie stays on your list since its most
    recent

    addition to the list. This field must be between 0 and 540 inclusive.</p>

    <p>This field is ignored for <code>logical_user_list</code> and <code>rule_based_user_list</code>

    types. Membership to lists of these types depends on the rules defined by

    the lists.</p>'
  filterable: true
  is_repeated: false
  sortable: true
user_list.membership_status:
  data_type: ENUM
  description: '<p>Membership status of this user list. Indicates whether a user list
    is open

    or active. Only open user lists can accumulate more users and can be

    targeted to.</p>'
  enum_values: CLOSED, OPEN, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.name:
  data_type: STRING
  description: '<p>Name of this user list.

    Unique per user list, except in some cases where a user list of the same

    name has <code>access_reason</code> set to <code>SHARED</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
user_list.read_only:
  data_type: BOOLEAN
  description: '<p>Output only. An option that indicates if a user may edit a list.
    Depends on

    the list ownership and list type. For example, external remarketing user

    lists are not editable.</p>

    <p>This field is read-only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
user_list.resource_name:
  data_type: RESOURCE_NAME
  description: '<p>Immutable. The resource name of the user list.

    User list resource names have the form:</p>

    <p><code>customers/{customer_id}/userLists/{user_list_id}</code></p>'
  filterable: true
  is_repeated: false
  sortable: false
user_list.rule_based_user_list.flexible_rule_user_list.exclusive_operands:
  data_type: MESSAGE
  description: <p>Rules representing users that should be excluded from the user list.
    These are located on the right side of the AND_NOT operator, and joined together
    by OR.</p>
  filterable: false
  is_repeated: true
  sortable: false
user_list.rule_based_user_list.flexible_rule_user_list.inclusive_operands:
  data_type: MESSAGE
  description: <p>Rules representing users that should be included in the user list.
    These are located on the left side of the AND_NOT operator, and joined together
    by either AND/OR as specified by the inclusive_rule_operator.</p>
  filterable: false
  is_repeated: true
  sortable: false
user_list.rule_based_user_list.flexible_rule_user_list.inclusive_rule_operator:
  data_type: ENUM
  description: <p>Operator that defines how the inclusive operands are combined.</p>
  enum_values: AND, OR, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
user_list.rule_based_user_list.prepopulation_status:
  data_type: ENUM
  description: <p>The status of pre-population. The field is default to NONE if not
    set which means the previous users will not be considered. If set to REQUESTED,
    past site visitors or app users who match the list definition will be included
    in the list (works on the Display Network only). This will only add past users
    from within the last 30 days, depending on the list's membership duration and
    the date when the remarketing tag is added. The status will be updated to FINISHED
    once request is processed, or FAILED if the request fails.</p>
