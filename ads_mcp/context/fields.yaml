  sortable: true
campaign_budget.total_amount_micros:
  data_type: INT64
  description: '<p>The total amount to be spent by the campaign over its entire duration.

    This field is used <em>only</em> when the CampaignBudget <code>period</code> is
    set to

    <code>CUSTOM_PERIOD</code>. It represents the budget cap for the campaign''s lifetime,

    rather than a daily limit. The amount is specified in micros in the

    account''s local currency. One million micros is equivalent to one currency

    unit.</p>

    <p>This field is mutually exclusive with ''amount_micros''. Only one of

    ''total_amount_micros'' or ''amount_micros'' should be set.</p>'
  filterable: true
  is_repeated: false
  sortable: true
