  description: <p>A search term.</p>
  filterable: true
  is_repeated: false
  sortable: false
segments.search_term_match_source:
  data_type: ENUM
  description: '<p>Specifies the source for how the search term was matched, which
    reveals the

    type of ad campaign responsible. Use this to distinguish between automated

    campaigns (like AI Max, Dynamic Search Ads) and keyword-based campaigns

    (Standard).</p>'
  enum_values: ADVERTISER_PROVIDED_KEYWORD, AI_MAX_BROAD_MATCH, AI_MAX_KEYWORDLESS,
    DYNAMIC_SEARCH_ADS, PERFORMANCE_MAX, UNKNOWN, UNSPECIFIED, VERTICAL_ADS_DATA_FEED
  filterable: true
  is_repeated: false
  sortable: true
segments.search_term_match_type:
  data_type: ENUM
  description: '<p>Match type of the keyword that triggered the ad. This segment is
    for use

    with keyword_view. For other resources, use match_type. While match_type is

    filtered to Broad, Exact, Phrase and Ai Max, search_term_match_type

    includes variants like Near Exact and Near Phrase.</p>'
  enum_values: AI_MAX, BROAD, EXACT, NEAR_EXACT, NEAR_PHRASE, PERFORMANCE_MAX, PHRASE,
    UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
segments.search_term_targeting_status:
  data_type: ENUM
  description: '<p>Indicates whether the search term is currently one of your targeted
    or

    excluded keywords.</p>'
  enum_values: ADDED, ADDED_EXCLUDED, EXCLUDED, NONE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_ad_event_type:
  data_type: ENUM
  description: <p>iOS Store Kit Ad Network ad event type.</p>
  enum_values: INTERACTION, UNAVAILABLE, UNKNOWN, UNSPECIFIED, VIEW
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_attribution_credit:
  data_type: ENUM
  description: <p>iOS Store Kit Ad Network attribution credit</p>
  enum_values: CONTRIBUTED, UNAVAILABLE, UNKNOWN, UNSPECIFIED, WON
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_coarse_conversion_value:
  data_type: ENUM
  description: <p>iOS Store Kit Ad Network coarse conversion value.</p>
  enum_values: HIGH, LOW, MEDIUM, NONE, UNAVAILABLE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_fine_conversion_value:
  data_type: INT64
  description: '<p>iOS Store Kit Ad Network conversion value.

    Null value means this segment is not applicable, for example, non-iOS

    campaign.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_postback_sequence_index:
  data_type: INT64
  description: <p>iOS Store Kit Ad Network postback sequence index.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_redistributed_fine_conversion_value:
  data_type: INT64
  description: '<p>iOS Store Kit Ad Network redistributed fine conversion value.</p>

    <p>Google uses modeling on observed conversion values(obtained

    from Apple) to calculate conversions from SKAN postbacks where

    NULLs are returned. This column represents the sum of the modeled

    conversion values and the observed conversion values. See

    <a href="https://support.google.com/google-ads/answer/14892597">https://support.google.com/google-ads/answer/14892597</a>

    to lean more.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_source_app.sk_ad_network_source_app_id:
  data_type: STRING
  description: <p>App id where the ad that drove the iOS Store Kit Ad Network install
    was shown.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_source_domain:
  data_type: STRING
  description: '<p>Website where the ad that drove the iOS Store Kit Ad Network install
    was

    shown. Null value means this segment is not applicable, for example,

    non-iOS campaign, or was not present in any postbacks sent by Apple.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_source_type:
  data_type: ENUM
  description: '<p>The source type where the ad that drove the iOS Store Kit Ad Network

    install was shown. Null value means this segment is not applicable, for

    example, non-iOS campaign, or neither source domain nor source app were

    present in any postbacks sent by Apple.</p>'
  enum_values: MOBILE_APPLICATION, UNAVAILABLE, UNKNOWN, UNSPECIFIED, WEBSITE
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_user_type:
  data_type: ENUM
  description: <p>iOS Store Kit Ad Network user type.</p>
  enum_values: NEW_INSTALLER, REINSTALLER, UNAVAILABLE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
segments.sk_ad_network_version:
  data_type: STRING
  description: <p>The version of the SKAdNetwork API used.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.slot:
  data_type: ENUM
  description: <p>Position of the ad.</p>
  enum_values: CONTENT, MIXED, SEARCH_OTHER, SEARCH_PARTNER_OTHER, SEARCH_PARTNER_TOP,
    SEARCH_SIDE, SEARCH_TOP, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
segments.travel_destination_city:
  data_type: RESOURCE_NAME
  description: <p>The city the user is searching for at query time.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.travel_destination_country:
  data_type: RESOURCE_NAME
  description: <p>The country the user is searching for at query time.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.travel_destination_region:
  data_type: RESOURCE_NAME
  description: <p>The region the user is searching for at query time.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_event_participant_display_names:
  data_type: STRING
  description: '<p>The display names of participants in an event listing, like performers,

    speakers, or teams.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_hotel_class:
  data_type: INT64
  description: '<p>The class of the hotel. Generally in the range of 1 to 5 stars,
    but fully

    customizable in the hotel feed.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing:
  data_type: STRING
  description: <p>The listing associated with a listing impression, click or conversion.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_brand:
  data_type: STRING
  description: '<p>The brand associated with a specific listing within a Vertical
    Ads

    context, for example, the brand of a car rental, a vacation home, or an

    event.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_city:
  data_type: RESOURCE_NAME
  description: <p>The city where the vertical ads listing is located.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_country:
  data_type: RESOURCE_NAME
  description: <p>The country where the vertical ads listing is located.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_region:
  data_type: RESOURCE_NAME
  description: <p>The region where the vertical ads listing is located.</p>
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_user_rating:
  data_type: INT64
  description: '<p>Integer value specifying the user rating of the vertical ads listing

    as a number from 1 to 5, where 5 is the best. The value will always be

    within this range.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_listing_venue:
  data_type: STRING
  description: '<p>The name of the venue for the vertical ads listing, for example,
    the

    venue for a concert event.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_partner_account:
  data_type: INT64
  description: '<p>A specific partner account within a Partner Center (for example,
    Hotel

    Center) that supplies inventory feed data for Vertical Ads.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.vertical_ads_vertical:
  data_type: ENUM
  description: '<p>Type of vertical ad, such as Vacation Rentals, Car Rentals, or

    Events, used to categorize and segment data in the context of Vertical

    Ads.</p>'
  enum_values: EVENTS, FLIGHTS, HOTELS, RENTAL_CARS, THINGS_TO_DO, UNKNOWN, UNSPECIFIED,
    VACATION_RENTALS
  filterable: true
  is_repeated: false
  sortable: true
segments.webpage:
  data_type: RESOURCE_NAME
  description: <p>Resource name of the ad group criterion that represents webpage
    criterion.</p>
  filterable: true
  is_repeated: false
  sortable: false
segments.week:
  data_type: DATE
  description: '<p>Week as defined as Monday through Sunday, and represented by the
    date of

    Monday. Formatted as yyyy-MM-dd.</p>'
  filterable: true
  is_repeated: false
  sortable: true
segments.year:
  data_type: INT32
  description: <p>Year, formatted as yyyy.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.brand.display_name:
  data_type: STRING
  description: <p>Output only. A text representation of a brand.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.brand.entity_id:
  data_type: STRING
  description: <p>The Commercial KG MID for the brand.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.brand.primary_url:
  data_type: STRING
  description: <p>Output only. The primary url of a brand.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.brand.rejection_reason:
  data_type: ENUM
  description: <p>Output only. The rejection reason when a brand status is REJECTED.</p>
  enum_values: EXISTING_BRAND, EXISTING_BRAND_VARIANT, INCORRECT_INFORMATION, NOT_A_BRAND,
    UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.brand.status:
  data_type: ENUM
  description: <p>Output only. The status of a brand.</p>
  enum_values: APPROVED, CANCELLED, DEPRECATED, ENABLED, REJECTED, UNKNOWN, UNSPECIFIED,
    UNVERIFIED
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.criterion_id:
  data_type: INT64
  description: '<p>Output only. The ID of the criterion.</p>

    <p>This field is ignored for mutates.</p>'
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.keyword.match_type:
  data_type: ENUM
  description: <p>The match type of the keyword.</p>
  enum_values: BROAD, EXACT, PHRASE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.keyword.text:
  data_type: STRING
  description: <p>The text of the keyword (at most 80 characters and 10 words).</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.mobile_app_category.mobile_app_category_constant:
  data_type: RESOURCE_NAME
  description: <p>The mobile app category constant resource name.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.mobile_application.app_id:
  data_type: STRING
  description: <p>A string that uniquely identifies a mobile application to Google
    Ads API. The format of this string is "{platform}-{platform_native_id}", where
    platform is "1" for iOS apps and "2" for Android apps, and where platform_native_id
    is the mobile application identifier native to the corresponding platform. For
    iOS, this native identifier is the 9 digit string that appears at the end of an
    App Store URL (for example, "476943146" for "Flood-It! 2" whose App Store link
    is "http://itunes.apple.com/us/app/flood-it!-2/id476943146"). For Android, this
    native identifier is the application's package name (for example, "com.labpixies.colordrips"
    for "Color Drips" given Google Play link "https://play.google.com/store/apps/details?id=com.labpixies.colordrips").
    A well formed app id for Google Ads API would thus be "1-476943146" for iOS and
    "2-com.labpixies.colordrips" for Android. This field is required and must be set
    in CREATE operations.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.mobile_application.name:
  data_type: STRING
  description: <p>Name of this mobile application.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.negative:
  data_type: BOOLEAN
  description: '<p>Immutable. If true, the criterion is excluded. If false, the criterion
    is

    targeted.</p>'
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.placement.url:
  data_type: STRING
  description: <p>URL of the placement. For example, "http://www.domain.com".</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.resource_name:
  data_type: RESOURCE_NAME
  description: '<p>Immutable. The resource name of the shared criterion.

    Shared set resource names have the form:</p>

    <p><code>customers/{customer_id}/sharedCriteria/{shared_set_id}~{criterion_id}</code></p>'
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.retail_filter.expression.name:
  data_type: STRING
  description: <p>The name of the expression. This name is used for grouping Retail
    Tags into one logical expression with OR operator. The name can contain at most
    20 characters. Only lowercase latin letters, underscores, and numbers are allowed.
    This field is required and must be unique within the shared set.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.retail_filter.tag.expression_name:
  data_type: STRING
  description: <p>The name of the expression this tag belongs to. If empty, the tag
    is a top-level condition.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.retail_filter.tag.value:
  data_type: STRING
  description: <p>The value of the tag. It can contain at most 50 characters. All
    Unicode characters except comma and newline are allowed. This field is required.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.shared_set:
  data_type: RESOURCE_NAME
  description: <p>Immutable. The shared set to which the shared criterion belongs.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.type:
  data_type: ENUM
  description: <p>Output only. The type of the criterion.</p>
  enum_values: AD_SCHEDULE, AGE_RANGE, APP_PAYMENT_MODEL, AUDIENCE, BRAND, BRAND_LIST,
    CARRIER, COMBINED_AUDIENCE, CONTENT_LABEL, CUSTOM_AFFINITY, CUSTOM_AUDIENCE, CUSTOM_INTENT,
    DEVICE, GENDER, INCOME_RANGE, IP_BLOCK, KEYWORD, KEYWORD_THEME, LANGUAGE, LIFE_EVENT,
    LISTING_GROUP, LISTING_SCOPE, LOCAL_SERVICE_ID, LOCATION, LOCATION_GROUP, MOBILE_APPLICATION,
    MOBILE_APP_CATEGORY, MOBILE_DEVICE, NEGATIVE_KEYWORD_LIST, OPERATING_SYSTEM_VERSION,
    PARENTAL_STATUS, PLACEMENT, PLACEMENT_LIST, PROXIMITY, RETAIL_FILTER, RETAIL_FILTER_BUNDLE,
    SEARCH_THEME, TOPIC, UNKNOWN, UNSPECIFIED, USER_INTEREST, USER_LIST, VERTICAL_ADS_ITEM_GROUP_RULE,
    VERTICAL_ADS_ITEM_GROUP_RULE_LIST, VIDEO_LINEUP, WEBPAGE, WEBPAGE_LIST, YOUTUBE_CHANNEL,
    YOUTUBE_VIDEO
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.vertical_ads_item_group_rule.city_criterion_id:
  data_type: RESOURCE_NAME
  description: <p>The resource name of the Geo Target Constant for the city.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.vertical_ads_item_group_rule.country_criterion_id:
  data_type: RESOURCE_NAME
  description: <p>The resource name of the Geo Target Constant for the country.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.vertical_ads_item_group_rule.event_participant_display_name:
  data_type: STRING
  description: <p>The name of an associated participant for a given event. For example,
    headliner for a concert event.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.vertical_ads_item_group_rule.hotel_class:
  data_type: INT64
  description: <p>Integer value specifying the class rating for a hotel. Ranges from
    1 to 5 stars.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.vertical_ads_item_group_rule.item_code:
  data_type: STRING
  description: <p>The id specifying a particular Vertical Ad listing.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.vertical_ads_item_group_rule.region_criterion_id:
  data_type: RESOURCE_NAME
  description: <p>The resource name of the Geo Target Constant for the region.</p>
  filterable: true
  is_repeated: false
  sortable: false
shared_criterion.vertical_ads_item_group_rule.user_rating:
  data_type: INT64
  description: <p>Integer value specifying the user rating for a Vertical Ad listing.
    Ranges from 1 to 5, where 5 is the best.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.vertical_ads_item_group_rule.venue:
  data_type: STRING
  description: <p>A name for a specific location, like the venue for a concert event.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.webpage.conditions:
  data_type: MESSAGE
  description: <p>Conditions, or logical expressions, for webpage targeting. The list
    of webpage targeting conditions are and-ed together when evaluated for targeting.
    An empty list of conditions indicates all pages of the campaign's website are
    targeted. This field is required for CREATE operations and is prohibited on UPDATE
    operations.</p>
  filterable: false
  is_repeated: true
  sortable: false
shared_criterion.webpage.coverage_percentage:
  data_type: DOUBLE
  description: <p>Website criteria coverage percentage. This is the computed percentage
    of website coverage based on the website target, negative website target and negative
    keywords in the ad group and campaign. For instance, when coverage returns as
    1, it indicates it has 100% coverage. This field is read-only.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.webpage.criterion_name:
  data_type: STRING
  description: <p>The name of the criterion that is defined by this parameter. The
    name value will be used for identifying, sorting and filtering criteria with this
    type of parameters. This field is required for CREATE operations and is prohibited
    on UPDATE operations.</p>
  filterable: true
  is_repeated: false
  sortable: true
shared_criterion.webpage.sample.sample_urls:
