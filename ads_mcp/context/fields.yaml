  description: '<p>Output only. The type of bidding strategy.</p>

    <p>A bidding strategy can be created by setting either the bidding scheme to

    create a standard bidding strategy or the <code>bidding_strategy</code> field
    to

    create a portfolio bidding strategy.</p>

    <p>This field is read-only.</p>'
  enum_values: COMMISSION, ENHANCED_CPC, FIXED_CPM, FIXED_SHARE_OF_VOICE, INVALID,
    MANUAL_CPA, MANUAL_CPC, MANUAL_CPM, MANUAL_CPV, MAXIMIZE_CONVERSIONS, MAXIMIZE_CONVERSION_VALUE,
    PAGE_ONE_PROMOTED, PERCENT_CPC, TARGET_CPA, TARGET_CPC, TARGET_CPM, TARGET_CPV,
