accessible_bidding_strategy.id:
  data_type: INT64
  description: <p>Output only. The ID of the bidding strategy.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.maximize_conversion_value.target_roas:
  data_type: DOUBLE
  description: <p>Output only. The target return on ad spend (ROAS) option. If set,
    the bid strategy will maximize revenue while averaging the target return on ad
    spend. If the target ROAS is high, the bid strategy may not be able to spend the
    full budget. If the target ROAS is not set, the bid strategy will aim to achieve
    the highest possible ROAS for the budget.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.maximize_conversions.target_cpa_micros:
  data_type: INT64
  description: <p>Output only. The target cost per acquisition (CPA) option. This
    is the average amount that you would like to spend per acquisition.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.name:
  data_type: STRING
  description: <p>Output only. The name of the bidding strategy.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.owner_customer_id:
  data_type: INT64
  description: <p>Output only. The ID of the Customer which owns the bidding strategy.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.owner_descriptive_name:
  data_type: STRING
  description: '<p>Output only. descriptive_name of the Customer which owns the bidding

    strategy.</p>'
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.resource_name:
  data_type: RESOURCE_NAME
  description: '<p>Output only. The resource name of the accessible bidding strategy.

    AccessibleBiddingStrategy resource names have the form:</p>

    <p><code>customers/{customer_id}/accessibleBiddingStrategies/{bidding_strategy_id}</code></p>'
  filterable: true
  is_repeated: false
  sortable: false
accessible_bidding_strategy.target_cpa.target_cpa_micros:
  data_type: INT64
  description: <p>Output only. Average CPA target. This target should be greater than
    or equal to minimum billable unit based on the currency for the account.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_impression_share.cpc_bid_ceiling_micros:
  data_type: INT64
  description: <p>Output only. The highest CPC bid the automated bidding system is
    permitted to specify. This is a required field entered by the advertiser that
    sets the ceiling and specified in local micros.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_impression_share.location:
  data_type: ENUM
  description: <p>Output only. The targeted location on the search results page.</p>
  enum_values: ABSOLUTE_TOP_OF_PAGE, ANYWHERE_ON_PAGE, TOP_OF_PAGE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_impression_share.location_fraction_micros:
  data_type: INT64
  description: <p>The chosen fraction of ads to be shown in the targeted location
    in micros. For example, 1% equals 10,000.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_roas.target_roas:
  data_type: DOUBLE
  description: <p>Output only. The chosen revenue (based on conversion data) per unit
    of spend.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_spend.cpc_bid_ceiling_micros:
  data_type: INT64
  description: <p>Output only. Maximum bid limit that can be set by the bid strategy.
    The limit applies to all keywords managed by the strategy.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.target_spend.target_spend_micros:
  data_type: INT64
  description: <p>Output only. The spend target under which to maximize clicks. A
    TargetSpend bidder will attempt to spend the smaller of this value or the natural
    throttling spend amount. If not specified, the budget is used as the spend target.
    This field is deprecated and should no longer be used. See <a href="https://ads-developers.googleblog.com/2020/05/reminder-about-sunset-creation-of.html">https://ads-developers.googleblog.com/2020/05/reminder-about-sunset-creation-of.html</a>
    for details.</p>
  filterable: true
  is_repeated: false
  sortable: true
accessible_bidding_strategy.type:
  data_type: ENUM
  description: <p>Output only. The type of the bidding strategy.</p>
  enum_values: COMMISSION, ENHANCED_CPC, FIXED_CPM, FIXED_SHARE_OF_VOICE, INVALID,
    MANUAL_CPA, MANUAL_CPC, MANUAL_CPM, MANUAL_CPV, MAXIMIZE_CONVERSIONS, MAXIMIZE_CONVERSION_VALUE,
    PAGE_ONE_PROMOTED, PERCENT_CPC, TARGET_CPA, TARGET_CPC, TARGET_CPM, TARGET_CPV,
    TARGET_IMPRESSION_SHARE, TARGET_OUTRANK_SHARE, TARGET_ROAS, TARGET_SPEND, UNKNOWN,
    UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
account_budget.adjusted_spending_limit_micros:
  data_type: INT64
  description: '<p>Output only. The adjusted spending limit in micros.  One million
    is

    equivalent to one unit.</p>

    <p>If the approved spending limit is finite, the adjusted

    spending limit may vary depending on the types of adjustments applied

    to this budget, if applicable.</p>

    <p>The different kinds of adjustments are described here:

    <a href="https://support.google.com/google-ads/answer/1704323">https://support.google.com/google-ads/answer/1704323</a></p>

    <p>For example, a debit adjustment reduces how much the account is

    allowed to spend.</p>'
  filterable: true
  is_repeated: false
  sortable: true
account_budget.adjusted_spending_limit_type:
  data_type: ENUM
  description: '<p>Output only. The adjusted spending limit as a well-defined type,
    for

    example, INFINITE. This will only be populated if the adjusted spending

    limit is INFINITE, which is guaranteed to be true if the approved

    spending limit is INFINITE.</p>'
  enum_values: INFINITE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
account_budget.amount_served_micros:
  data_type: INT64
  description: '<p>Output only. The value of Ads that have been served, in micros.</p>

    <p>This includes overdelivery costs, in which case a credit might be

    automatically applied to the budget (see total_adjustments_micros).</p>'
  filterable: true
  is_repeated: false
  sortable: true
