metrics.absolute_top_impression_percentage:
  data_type: DOUBLE
  description: '<p>Search absolute top impression share is the percentage of your
    Search ad

    impressions that are shown in the most prominent Search position.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audibility_invalid_givt_measurable_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions for which Active View could measure audibility,

    but that were filtered out by traffic quality filters, divided by the total

    number of impressions measurable for audibility. Only includes GIVT

    (general invalid traffic) impressions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audibility_invalid_measurable_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions for which Active View could measure audibility,

    but that were filtered out by traffic quality filters, divided by the

    total number of impressions measurable for audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audibility_measurable_impressions:
  data_type: INT64
  description: '<p>The number of impressions for which Active View could measure if
    the ad was

    audible.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audibility_measurable_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions for which Active View could measure if
    the ad was

    audible, divided by the total number of impressions with Active View audio

    enabled.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_impressions:
  data_type: INT64
  description: '<p>The number of impressions that were audible (volume &gt; 0%) at
    any point

    during the ad playback.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible (volume &gt; 0%) at
    any point

    during the ad playback, divided by the total number of impressions

    measurable for audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_quartile_p100_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible at the fourth quartile
    of the

    ad playback, divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_quartile_p25_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible at the first quartile
    of the

    ad playback, divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_quartile_p50_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible at the second quartile
    of the

    ad playback, divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_quartile_p75_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible at the third quartile
    of the

    ad playback, divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_thirty_seconds_impressions:
  data_type: INT64
  description: '<p>The number of impressions that were audible for at least 30 seconds

    (cumulative).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_thirty_seconds_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible for at least 30 seconds

    (cumulative), divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_two_seconds_impressions:
  data_type: INT64
  description: '<p>The number of impressions that were audible for at least 2 seconds

    (cumulative).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_audible_two_seconds_impressions_rate:
  data_type: DOUBLE
  description: '<p>The number of impressions that were audible for at least 2 seconds

    (cumulative), divided by the total number of impressions measurable for

    audibility.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_cpm:
  data_type: DOUBLE
  description: <p>Average cost of viewable impressions (<code>active_view_impressions</code>).</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_ctr:
  data_type: DOUBLE
  description: '<p>Active view measurable clicks divided by active view viewable impressions.</p>

    <p>This metric is reported only for the Display Network.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_impressions:
  data_type: INT64
  description: '<p>A measurement of how often your ad has become viewable on a Display

    Network site.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_measurability:
  data_type: DOUBLE
  description: '<p>The ratio of impressions that could be measured by Active View
    over the

    number of served impressions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_measurable_cost_micros:
  data_type: INT64
  description: '<p>The cost of the impressions you received that were measurable by
    Active

    View.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_measurable_impressions:
  data_type: INT64
  description: '<p>The number of times your ads are appearing on placements in positions

    where they can be seen.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.active_view_viewability:
  data_type: DOUBLE
  description: '<p>The percentage of time when your ad appeared on an Active View
    enabled site

    (measurable impressions) and was viewable (viewable impressions).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_average_cart_size:
  data_type: DOUBLE
  description: '<p>All average cart size is the average number of products in each
    order

    attributed to your ads. Includes the amount from the average_cart_size

    metric, plus avg. cart size from all your conversion actions, even if your

    campaigns are not actively optimizing towards them. It''s calculated using

    product info from cart data to give more detail than conversion value

    alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_average_order_value_micros:
  data_type: INT64
  description: '<p>All average order value is the average revenue you made per order

    attributed to your ads. Includes the amount from the average_order_value

    metric, plus avg. order value from all your conversion actions, even

    if your campaigns are not actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions:
  data_type: DOUBLE
  description: '<p>The total number of conversions. This includes all conversions
    regardless

    of the value of include_in_conversions_metric.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The total number of conversions. This includes all conversions
    regardless

    of the value of include_in_conversions_metric. When this column is selected

    with date, the values in date column means the conversion date. Details for

    the <code>by_conversion_date</code> columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand
    conversions

    by time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_click_to_call:
  data_type: DOUBLE
  description: '<p>The number of times people clicked the "Call" button to call a
    business

    during or after clicking an ad. This number doesn''t include whether or not

    calls were connected, or the duration of any calls.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_directions:
  data_type: DOUBLE
  description: '<p>The number of times people clicked a "Get directions" button to
    navigate to

    a business after clicking an ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_interactions_rate:
  data_type: DOUBLE
  description: '<p>All conversions from interactions (as oppose to view through conversions)

    divided by the number of ad interactions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_interactions_value_per_interaction:
  data_type: DOUBLE
  description: '<p>The value of all conversions from interactions divided by the total
    number

    of interactions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_click_to_call:
  data_type: DOUBLE
  description: '<p>Number of call button clicks on any location surface after a chargeable
    ad

    event (click or impression). This measure is coming from Asset based

    location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_directions:
  data_type: DOUBLE
  description: '<p>Number of driving directions clicks on any location surface after
    a

    chargeable ad event (click or impression). This measure is coming

    from Asset based location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_menu:
  data_type: DOUBLE
  description: '<p>Number of menu link clicks on any location surface after a chargeable
    ad

    event (click or impression). This measure is coming from Asset based

    location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_order:
  data_type: DOUBLE
  description: '<p>Number of order clicks on any location surface after a chargeable
    ad event

    (click or impression). This measure is coming from Asset based

    location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_other_engagement:
  data_type: DOUBLE
  description: '<p>Number of other types of local action clicks on any location surface
    after

    a chargeable ad event (click or impression). This measure is coming

    from Asset based location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_store_visits:
  data_type: DOUBLE
  description: '<p>Estimated number of visits to the business after a chargeable

    ad event (click or impression). This measure is coming from Asset

    based location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_location_asset_website:
  data_type: DOUBLE
  description: '<p>Number of website URL clicks on any location surface after a chargeable
    ad

    event (click or impression). This measure is coming from Asset based

    location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_menu:
  data_type: DOUBLE
  description: '<p>The number of times people clicked a link to view a business''s
    menu after

    clicking an ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_order:
  data_type: DOUBLE
  description: '<p>The number of times people placed an order at a business after
    clicking an

    ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_other_engagement:
  data_type: DOUBLE
  description: '<p>The number of other conversions (for example, posting a review
    or saving a

    location for a business) that occurred after people clicked an ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_store_visit:
  data_type: DOUBLE
  description: '<p>Estimated number of times people visited a business after clicking
    an ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_from_store_website:
  data_type: DOUBLE
  description: '<p>The number of times that people were taken to a business''s URL
    after

    clicking an ad.</p>

    <p>This metric applies to feed items only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_value:
  data_type: DOUBLE
  description: <p>The value of all conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_value_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of all conversions. When this column is selected with
    date, the

    values in date column means the conversion date. Details for the

    <code>by_conversion_date</code> columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand
    conversions by

    time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_conversions_value_per_cost:
  data_type: DOUBLE
  description: '<p>The value of all conversions divided by the total cost of ad interactions

    (such as clicks for text ads or views for video ads).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>All cost of goods sold is the total cost of the products you sold
    in orders

    attributed to your ads. Includes the amount from the

    cost_of_goods_sold_micros metric, plus cost of goods sold from all

    conversion actions, even if your campaigns are not actively optimizing

    towards them. It''s calculated using product info from cart data to give

    more detail than conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_cross_sell_cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>All cross-sell cost of goods sold is the total cost of products
    sold as a

    result of advertising a different product. Includes the amount from the

    cross_sell_cost_of_goods_sold_micros metric, plus cross-sell cost of goods

    sold from all your conversion actions, even if your campaigns are not

    actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_cross_sell_gross_profit_micros:
  data_type: INT64
  description: '<p>All cross-sell gross profit is the profit you made from products
    sold as a

    result of advertising a different product, minus cost of goods sold (COGS).

    Includes the amount from the cross_sell_gross_profit_micros metric, plus

    cross-sell gross profit from all your conversion actions, even if your

    campaigns are not actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_cross_sell_revenue_micros:
  data_type: INT64
  description: '<p>All cross-sell revenue is the total amount you made from products
    sold as

    a result of advertising a different product. Includes the amount from the

    cross_sell_revenue_micros metric, plus cross-sell revenue from all your

    conversion actions, even if your campaigns are not actively optimizing

    towards them. It''s calculated using product info from cart data to give

    more detail than conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_cross_sell_units_sold:
  data_type: DOUBLE
  description: '<p>All cross-sell units sold is the total number of products sold
    as a result

    of advertising a different product. Includes the amount shown in the

    cross_sell_units_sold metric, plus cross-sell units sold from all your

    conversion actions, even if your campaigns are not actively optimizing

    towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_gross_profit_margin:
  data_type: DOUBLE
  description: '<p>All gross profit margin is the percentage gross profit you made
    from

    orders attributed to your ads, after taking out the cost of goods sold

    (COGS). This value is between 0.0 and 1.0, where 1.0 means 100%. Includes

    the amount from the gross_profit_margin metric, plus gross profit margin

    across all conversion actions, even if your campaigns are not actively

    optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_gross_profit_micros:
  data_type: INT64
  description: '<p>All gross profit is the total profit made from orders attributed
    to your

    ads minus the cost of goods sold (COGS). Includes the amount from the

    gross_profit_micros metric, plus gross profit from all your conversion

    actions, even if your campaigns are not actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_lead_cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>All lead cost of goods sold is the total cost of products sold
    as a result

    of advertising the same product. Includes the amount shown in the

    lead_cost_of_goods_sold_micros metric, plus lead cost of goods sold from

    all your conversion actions, even if your campaigns are not actively

    optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_lead_gross_profit_micros:
  data_type: INT64
  description: '<p>All lead gross profit is the profit you made from products sold
    as a result

    of advertising the same product, minus cost of goods sold (COGS). Includes

    the amount from the lead_gross_profit_micros metric, plus lead gross profit

    from all your conversion actions, even if your campaigns are not actively

    optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_lead_revenue_micros:
  data_type: INT64
  description: '<p>All lead revenue is the total amount you made from products sold
    as a

    result of advertising the same product. Includes the amount shown in the

    lead_revenue_micros metric, plus lead revenue from all your conversion

    actions, even if your campaigns are not actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_lead_units_sold:
  data_type: DOUBLE
  description: '<p>All lead units sold is the total number of products sold as a result
    of

    advertising the same product. Includes the amount shown in the

    lead_units_sold metric, plus lead units sold from all your conversion

    actions, even if your campaigns are not actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_new_customer_lifetime_value:
  data_type: DOUBLE
  description: '<p>All of new customers'' lifetime conversion value. If you have set
    up

    customer acquisition goal at either account level or campaign level, this

    will include the additional conversion value from new customers for both

    biddable and non-biddable conversions. If your campaign has adopted the

    customer acquisition goal and selected "bid higher for new customers",

    these values will be included in <code>all_conversions_value</code>. See

    <a href="https://support.google.com/google-ads/answer/12080169">About customer
    lifecycle

    goals</a> for more

    details.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_orders:
  data_type: DOUBLE
  description: '<p>All orders is total number of purchase conversions attributed to
    your ads.

    Includes the amount from the orders metric, plus orders from all your

    conversion actions, even if your campaigns are not actively optimizing

    towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_revenue_micros:
  data_type: INT64
  description: '<p>All revenue is the total you made from orders attributed to your
    ads.

    Includes the amount from the revenue_micros metric, plus revenue from all

    your conversion actions, even if your campaigns are not actively optimizing

    towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_units_sold:
  data_type: DOUBLE
  description: '<p>All units sold is the total number of products sold from orders
    attributed

    to your ads. Includes the amount from the units_sold metric, plus

    units sold from all your conversion actions, even if your campaigns are not

    actively optimizing towards them.

    It''s calculated using product info from cart data to give more detail than

    conversion value alone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.all_value_adjustment:
  data_type: DOUBLE
  description: '<p>The conversion value rule adjustment from all conversions in all
    conversion

    categories.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_as_description_position_one_count:
  data_type: INT64
  description: '<p>Number of entities in which the asset is pinned to description
    1.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_as_description_position_two_count:
  data_type: INT64
  description: '<p>Number of entities in which the asset is pinned to description
    2.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_as_headline_position_one_count:
  data_type: INT64
  description: '<p>Number of entities in which the asset is pinned to headline 1.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_as_headline_position_three_count:
  data_type: INT64
  description: '<p>Number of entities in which the asset is pinned to headline 3.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_as_headline_position_two_count:
  data_type: INT64
  description: '<p>Number of entities in which the asset is pinned to headline 2.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.asset_pinned_total_count:
  data_type: INT64
  description: '<p>Number of total usages in which the asset is pinned.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.

    This metric is only supported in Search channel.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_absolute_top_impression_percentage:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells how
    often

    the ads of another participant showed in the most prominent position on the

    search results page.

    This percentage is computed only over the auctions that you appeared in

    the page.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_impression_share:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells the

    percentage of impressions that another participant obtained, over the total

    number of impressions that your ads were eligible for.

    Any value below 0.1 is reported as 0.0999.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_outranking_share:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells the

    percentage of impressions that your ads outranked (showed above)

    another participant in the auction, compared to the total number of

    impressions that your ads were eligible for.

    Any value below 0.1 is reported as 0.0999.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_overlap_rate:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells how
    often

    another participant''s ad received an impression when your ad also received

    an impression.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_position_above_rate:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells how
    often

    another participant''s ad was shown in a higher position than yours, when

    both of your ads were shown at the same page.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.auction_insight_search_top_impression_percentage:
  data_type: DOUBLE
  description: '<p>This metric is part of the Auction Insights report, and tells how
    often

    the ads of another participant showed adjacent to the top organic search

    results. This percentage is computed only over the auctions that you

    appeared in the page.</p>

    <p>This metric is not publicly available.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_cart_size:
  data_type: DOUBLE
  description: '<p>Average cart size is the average number of products in each order

    attributed to your ads.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. Average cart size is the total number of products sold

    divided by the total number of orders you received.</p>

    <p>Example: You received 2 orders, the first included 3 products and the

    second included 2. The average cart size is 2.5 products = (3+2)/2.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_cost:
  data_type: DOUBLE
  description: '<p>The average amount you pay per interaction. This amount is the
    total cost

    of your ads divided by the total number of interactions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_cpc:
  data_type: DOUBLE
  description: '<p>The total cost of all clicks divided by the total number of clicks

    received.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_cpe:
  data_type: DOUBLE
  description: '<p>The average amount that you''ve been charged for an ad engagement.
    This

    amount is the total cost of all ad engagements divided by the total number

    of ad engagements.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_cpm:
  data_type: DOUBLE
  description: <p>Average cost-per-thousand impressions (CPM).</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_impression_frequency_per_user:
  data_type: DOUBLE
  description: '<p>The average number of times a unique user saw your ad during the
    requested

    time period. This metric cannot be aggregated, and can only be requested

    for date ranges of 92 days or less. This metric is available for following

    campaign types - Display, Video, Discovery and App.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_order_value_micros:
  data_type: INT64
  description: '<p>Average order value is the average revenue you made per order attributed
    to

    your ads.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. Average order value is the total revenue from your orders

    divided by the total number of orders.</p>

    <p>Example: You received 3 orders which made $10, $15 and $20 worth of

    revenue. The average order value is $15 = ($10 + $15 + $20)/3.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_page_views:
  data_type: DOUBLE
  description: <p>Average number of pages viewed per session.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_target_cpa_micros:
  data_type: INT64
  description: '<p>The average Target CPA, or unset if not available (for example,
    for

    campaigns that had traffic from portfolio bidding strategies or non-tCPA).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_target_roas:
  data_type: DOUBLE
  description: '<p>The average Target ROAS, or unset if not available (for example,
    for

    campaigns that had traffic from portfolio bidding strategies or non-tROAS).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_time_on_site:
  data_type: DOUBLE
  description: '<p>Total duration of all sessions (in seconds) / number of sessions.
    Imported

    from Google Analytics.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.average_video_watch_time_duration_millis:
  data_type: INT64
  description: '<p>Average video watch time duration in milliseconds for video impressions

    that started playing.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.benchmark_average_max_cpc:
  data_type: DOUBLE
  description: <p>An indication of how other advertisers are bidding on similar products.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.benchmark_ctr:
  data_type: DOUBLE
  description: '<p>An indication on how other advertisers'' Shopping ads for similar
    products

    are performing based on how often people who see their ad click on it.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.biddable_app_install_conversions:
  data_type: DOUBLE
  description: <p>Number of app installs.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.biddable_app_post_install_conversions:
  data_type: DOUBLE
  description: <p>Number of in-app actions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.biddable_cohort_app_post_install_conversions:
  data_type: DOUBLE
  description: '<p>Participated in-app actions. The number of in app actions that
    come

    directly or indirectly from the campaign.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.biddable_indirect_install_first_in_app_conversion_micros:
  data_type: INT64
  description: '<p>The number of biddable first in app conversions where the app install
    was

    driven by interaction with a web campaign.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.bounce_rate:
  data_type: DOUBLE
  description: '<p>Percentage of clicks where the user only visited a single page
    on your

    site. Imported from Google Analytics.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.clicks:
  data_type: INT64
  description: <p>The number of clicks.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.clicks_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on
    clicks.</p>

    <p>Together with <code>clicks_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at <code>clicks_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.clicks_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    clicks. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on clicks, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.clicks_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on
    clicks.</p>

    <p>Together with <code>clicks_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval: <code>(clicks_point_estimate -

    clicks_margin_of_error,

    clicks_point_estimate + clicks_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.clicks_unique_query_clusters:
  data_type: INT64
  description: <p>Unique query intent cluster count for clicks.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.combined_clicks:
  data_type: INT64
  description: '<p>The number of times your ad or your site''s listing in the unpaid

    results was clicked. See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.combined_clicks_per_query:
  data_type: DOUBLE
  description: '<p>The number of times your ad or your site''s listing in the unpaid

    results was clicked (combined_clicks) divided by combined_queries. See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a> for details.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.combined_queries:
  data_type: INT64
  description: '<p>The number of searches that returned pages from your site in the
    unpaid

    results or showed one of your text ads. See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a> for details.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.content_budget_lost_impression_share:
  data_type: DOUBLE
  description: '<p>The estimated percent of times that your ad was eligible to show

    on the Display Network but didn''t because your budget was too low.

    Note: Content budget lost impression share is reported in the range of 0

    to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.content_impression_share:
  data_type: DOUBLE
  description: '<p>The impressions you''ve received on the Display Network divided

    by the estimated number of impressions you were eligible to receive.</p>

    <p>Note: Content impression share is reported in the range of 0.1 to 1. Any

    value below 0.1 is reported as 0.0999.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.content_rank_lost_impression_share:
  data_type: DOUBLE
  description: '<p>The estimated percentage of impressions on the Display Network

    that your ads didn''t receive due to poor Ad Rank.</p>

    <p>Note: Content rank lost impression share is reported in the range of 0

    to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_clicks:
  data_type: INT64
  description: '<p>The number of clicks on the control arm of an experiment.

    The treatment clicks value can be selected by using <code>clicks</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_conversion_value:
  data_type: DOUBLE
  description: '<p>The conversion value metric on the control arm of the experiment.

    The treatment conversion value can be selected by using

    <code>conversions_value</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_conversion_value_per_cost:
  data_type: DOUBLE
  description: '<p>The conversion value per cost metric on the control arm of the

    experiment. The treatment conversion value per cost value can be

    selected by using <code>conversions_value_per_cost</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_conversions:
  data_type: DOUBLE
  description: '<p>The conversions metric on the control arm of the experiment.

    The treatment conversions value can be selected by using

    <code>conversions</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_cost_micros:
  data_type: INT64
  description: '<p>The cost metric on the control arm of the experiment.

    The treatment cost value can be selected by using <code>cost_micros</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_cost_per_conversion:
  data_type: DOUBLE
  description: '<p>The cost per conversion metric on the control arm of the

    experiment. The treatment cost per conversion value can be

    selected by using <code>cost_per_conversion</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.control_impressions:
  data_type: INT64
  description: '<p>The impressions metric on the control arm of the experiment.

    The treatment impressions value can be selected by using <code>impressions</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_last_conversion_date:
  data_type: DATE
  description: '<p>The date of the most recent conversion for this conversion action.
    The date

    is in the customer''s time zone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_last_received_request_date_time:
  data_type: DATE
  description: '<p>The last date/time a conversion tag for this conversion action
    successfully

    fired and was seen by Google Ads. This firing event may not have been the

    result of an attributable conversion (for example, because the tag was

    fired from a browser that did not previously click an ad from an

    appropriate advertiser). The date/time is in the customer''s time zone.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_change_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on

    conversion value change.</p>

    <p>Together with <code>conversion_value_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval:

    <code>(conversion_value_change_point_estimate -

    conversion_value_margin_of_error,

    conversion_value_change_point_estimate +

    conversion_value_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on

    conversion value.</p>

    <p>Together with <code>conversion_value_change_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at

    <code>conversion_value_change_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    conversion value. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on conversion value, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_per_cost_change_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on

    conversion value per cost change.</p>

    <p>Together with <code>conversion_value_per_cost_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval:

    <code>(conversion_value_per_cost_change_point_estimate -

    conversion_value_per_cost_margin_of_error,

    conversion_value_per_cost_change_point_estimate +

    conversion_value_per_cost_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_per_cost_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on

    conversion value per cost.</p>

    <p>Together with <code>conversion_value_per_cost_change_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at

    <code>conversion_value_per_cost_change_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversion_value_per_cost_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    conversion value per cost. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on conversion value per cost, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions:
  data_type: DOUBLE
  description: '<p>The number of conversions. This only includes conversion actions
    which

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_absolute_change_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on
    conversions

    absolute change.</p>

    <p>Together with <code>conversions_absolute_change_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment - control). This field specifies the radius of the confidence

    interval, which is centered at

    <code>conversions_absolute_change_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_absolute_change_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    conversions absolute change. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on conversions absolute change, is

    3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_absolute_change_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on
    conversions

    absolute change.</p>

    <p>Together with <code>conversions_absolute_change_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment - control). This field specifies the point estimate, which is

    the center of the confidence interval:

    <code>(conversions_absolute_change_point_estimate -

    conversions_absolute_change_margin_of_error,

    conversions_absolute_change_point_estimate +

    conversions_absolute_change_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The number of conversions. This only includes conversion actions
    which

    include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions. When this column is selected with date, the values in date

    column means the conversion date. Details for the <code>by_conversion_date</code>

    columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand
    conversions by time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_from_interactions_rate:
  data_type: DOUBLE
  description: '<p>Conversions from interactions divided by the number of ad interactions

    (such as clicks for text ads or views for video ads). This only includes

    conversion actions which <code>include_in_conversions_metric</code> attribute
    is set

    to <code>true</code>. If you use conversion-based bidding, your bid strategies
    will

    optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_from_interactions_value_per_interaction:
  data_type: DOUBLE
  description: '<p>The value of conversions from interactions divided by the number
    of ad

    interactions. This only includes conversion actions which

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_unique_query_clusters:
  data_type: INT64
  description: <p>Unique query intent cluster count for conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_value:
  data_type: DOUBLE
  description: '<p>The value of conversions. This only includes conversion actions
    which

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_value_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of conversions. This only includes conversion actions
    which

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions. When this column is selected with date, the values in date

    column means the conversion date. Details for the <code>by_conversion_date</code>

    columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand
    conversions by time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.conversions_value_per_cost:
  data_type: DOUBLE
  description: '<p>The value of conversions divided by the cost of ad interactions.
    This only

    includes conversion actions which include_in_conversions_metric attribute

    is set to true. If you use conversion-based bidding, your bid strategies

    will optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_converted_currency_per_platform_comparable_conversion:
  data_type: DOUBLE
  description: '<p>The cost of the platform comparable conversion in the currency
    of the

    authorized customer.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_micros:
  data_type: INT64
  description: '<p>The sum of your cost-per-click (CPC) and cost-per-thousand impressions

    (CPM) costs during this period.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_micros_change_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on
    cost change.</p>

    <p>Together with <code>cost_micros_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval:

    <code>(cost_micros_change_point_estimate - cost_micros_margin_of_error,

    cost_micros_change_point_estimate + cost_micros_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_micros_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on
    cost.</p>

    <p>Together with <code>cost_micros_change_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at

    <code>cost_micros_change_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_micros_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    cost. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on cost, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>Cost of goods sold (COGS) is the total cost of the products you
    sold in

    orders attributed to your ads.</p>

    <p>How it works: You can add a cost of goods sold value to every product in

    Merchant Center. If you report conversions with cart data, the products you

    sold are matched with their cost of goods sold value and this can be used

    to calculate the gross profit you made on each order.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat has a cost of goods sold value of $3, the shirt

    has a cost of goods sold value of $5. The cost of goods sold for this order

    is $8 = $3 + $5.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_all_conversions:
  data_type: DOUBLE
  description: <p>The cost of ad interactions divided by all conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_conversion:
  data_type: DOUBLE
  description: '<p>The cost of ad interactions divided by conversions. This only includes

    conversion actions which <code>include_in_conversions_metric</code> attribute
    is set

    to <code>true</code>. If you use conversion-based bidding, your bid strategies
    will

    optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_conversion_change_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on
    cost per

    conversion change.</p>

    <p>Together with <code>cost_per_conversion_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval:

    <code>(cost_per_conversion_change_point_estimate -

    cost_per_conversion_margin_of_error,

    cost_per_conversion_change_point_estimate +

    cost_per_conversion_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_conversion_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on
    cost per

    conversion.</p>

    <p>Together with <code>cost_per_conversion_change_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at

    <code>cost_per_conversion_change_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_conversion_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    cost per conversion. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on cost per conversion, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_current_model_attributed_conversion:
  data_type: DOUBLE
  description: '<p>The cost of ad interactions divided by current model attributed

    conversions. This only includes conversion actions which

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cost_per_platform_comparable_conversion:
  data_type: DOUBLE
  description: '<p>The cost of ad interactions divided by the number of platform comparable

    conversions. This only includes conversion actions for which

    include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.coviewed_impressions:
  data_type: INT64
  description: '<p>All co-viewed impressions represent the total number of people
    who saw your

    ad. This includes people who are signed into their Google Account, as well

    as other people who are watching the same ad on a connected TV. This metric

    is only available for the Campaign resource with adjusted_age_range and

    adjusted_gender segments. These segmentations are mandatory to get the

    all coviewed impressions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_device_conversions:
  data_type: DOUBLE
  description: '<p>Conversions from when a customer clicks on a Google Ads ad on one
    device,

    then converts on a different device or browser.

    Cross-device conversions are already included in <code>all_conversions</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_device_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The number of cross-device conversions by conversion date.

    Details for the <code>by_conversion_date</code> columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand

    conversions by time with new

    columns</a></p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_device_conversions_value:
  data_type: DOUBLE
  description: <p>The sum of the value of cross-device conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_device_conversions_value_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The sum of cross-device conversions value by conversion date.

    Details for the <code>by_conversion_date</code> columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand

    conversions by time with new

    columns</a></p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_device_conversions_value_micros:
  data_type: INT64
  description: <p>The sum of the value of cross-device conversions, in micros.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_sell_cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>Cross-sell cost of goods sold (COGS) is the total cost of products
    sold as

    a result of advertising a different product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If these products don''t match then this is

    considered cross-sell. Cross-sell cost of goods sold is the total cost of

    the products sold that weren''t advertised.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat has a cost of goods sold value of $3, the shirt

    has a cost of goods sold value of $5. The cross-sell cost of goods sold for

    this order is $5.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_sell_gross_profit_micros:
  data_type: INT64
  description: '<p>Cross-sell gross profit is the profit you made from products sold
    as a

    result of advertising a different product, minus cost of goods sold (COGS).</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the purchase is a sold

    product. If these products don''t match then this is considered cross-sell.

    Cross-sell gross profit is the revenue you made from cross-sell attributed

    to your ads minus the cost of the goods sold.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The shirt is priced $20 and has a cost of goods sold value

    of $5. The cross-sell gross profit of this order is $15 = $20 - $5.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_sell_revenue_micros:
  data_type: INT64
  description: '<p>Cross-sell revenue is the total amount you made from products sold
    as a

    result of advertising a different product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If these products don''t match then this is

    considered cross-sell. Cross-sell revenue is the total value you made from

    cross-sell attributed to your ads.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat is priced $10 and the shirt is priced $20. The

    cross-sell revenue of this order is $20.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.cross_sell_units_sold:
  data_type: DOUBLE
  description: '<p>Cross-sell units sold is the total number of products sold as a
    result of

    advertising a different product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If these products don''t match then this is

    considered cross-sell. Cross-sell units sold is the total number of

    cross-sold products from all orders attributed to your ads.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat, a shirt and a jacket. The cross-sell units sold in this order is 2.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.ctr:
  data_type: DOUBLE
  description: '<p>The number of clicks your ad receives (Clicks) divided by the number

    of times your ad is shown (Impressions).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.current_model_attributed_conversions:
  data_type: DOUBLE
  description: '<p>Shows how your historic conversions data would look under the attribution

    model you''ve currently selected. This only includes conversion actions

    which include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.current_model_attributed_conversions_from_interactions_rate:
  data_type: DOUBLE
  description: '<p>Current model attributed conversions from interactions divided
    by the

    number of ad interactions (such as clicks for text ads or views for video

    ads). This only includes conversion actions which

    include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.current_model_attributed_conversions_from_interactions_value_per_interaction:
  data_type: DOUBLE
  description: '<p>The value of current model attributed conversions from interactions
    divided

    by the number of ad interactions. This only includes conversion actions

    which include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.current_model_attributed_conversions_value:
  data_type: DOUBLE
  description: '<p>The value of current model attributed conversions. This only includes

    conversion actions which include_in_conversions_metric attribute is set to

    true. If you use conversion-based bidding, your bid strategies will

    optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.current_model_attributed_conversions_value_per_cost:
  data_type: DOUBLE
  description: '<p>The value of current model attributed conversions divided by the
    cost of ad

    interactions. This only includes conversion actions which

    include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.eligible_impressions_from_location_asset_store_reach:
  data_type: INT64
  description: '<p>Number of impressions in which the business location was shown
    or the

    location was used for targeting. This measure is coming from Asset based

    location.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.engagement_rate:
  data_type: DOUBLE
  description: '<p>How often people engage with your ad after it''s shown to them.
    This is the

    number of ad expansions divided by the number of times your ad is shown.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.engagements:
  data_type: INT64
  description: '<p>The number of engagements.

    An engagement occurs when a viewer expands your Lightbox ad. Also, in the

    future, other ad types may support engagement metrics.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.general_invalid_click_rate:
  data_type: DOUBLE
  description: '<p>The percentage of clicks that have been filtered out of your total
    number

    of clicks (filtered + non-filtered clicks) due to being general invalid

    clicks. These are clicks Google considers illegitimate that are detected

    through routine means of filtration (that is, known invalid data-center

    traffic, bots and spiders or other crawlers, irregular patterns, etc).

    You''re not charged for them, and they don''t affect your account statistics.

    See

    <a href="https://support.google.com/campaignmanager/answer/6076504">Filtering
    invalid traffic to ensure

    quality</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.general_invalid_clicks:
  data_type: INT64
  description: '<p>Number of general invalid clicks. These are a subset of your invalid
    clicks

    that are detected through routine means of filtration (such as known

    invalid data-center traffic, bots and spiders or other crawlers, irregular

    patterns, etc.). You''re not charged for them, and they don''t affect your

    account statistics. See

    <a href="https://support.google.com/campaignmanager/answer/6076504">Filtering
    invalid traffic to ensure

    quality</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.gmail_forwards:
  data_type: INT64
  description: <p>The number of times the ad was forwarded to someone else as a message.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.gmail_saves:
  data_type: INT64
  description: '<p>The number of times someone has saved your Gmail ad to their inbox
    as a

    message.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.gmail_secondary_clicks:
  data_type: INT64
  description: '<p>The number of clicks to the landing page on the expanded state
    of Gmail

    ads.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.gross_profit_margin:
  data_type: DOUBLE
  description: '<p>Gross profit margin is the percentage gross profit you made from
    orders

    attributed to your ads, after taking out the cost of goods sold (COGS).</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. Gross profit margin is the gross profit you made divided

    by your total revenue and multiplied by 100%. Gross profit margin

    calculations only include products that have a cost of goods sold value in

    Merchant Center.</p>

    <p>Example: Someone bought a hat and a shirt in an order on your website. The

    hat is priced $10 and has a cost of goods sold value of $3. The shirt is

    priced $20 but has no cost of goods sold value. Gross profit margin for

    this order will only take into account the hat because it has a cost of

    goods sold value, so it''s 70% = ($10 - $3)/$10 x 100%.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.gross_profit_micros:
  data_type: INT64
  description: '<p>Gross profit is the profit you made from orders attributed to your
    ads

    minus the cost of goods sold (COGS).</p>

    <p>How it works: Gross profit is the revenue you made from sales attributed to

    your ads minus cost of goods sold. Gross profit calculations only include

    products that have a cost of goods sold value in Merchant Center.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt in an order from your website. The hat is priced $10 and

    the shirt is priced $20. The hat has a cost of goods sold value of $3, but

    the shirt has no cost of goods sold value. Gross profit for this order will

    only take into account the hat, so it''s $7 = $10 - $3.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.historical_creative_quality_score:
  data_type: ENUM
  description: <p>The creative historical quality score.</p>
  enum_values: ABOVE_AVERAGE, AVERAGE, BELOW_AVERAGE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
metrics.historical_landing_page_quality_score:
  data_type: ENUM
  description: <p>The quality of historical landing page experience.</p>
  enum_values: ABOVE_AVERAGE, AVERAGE, BELOW_AVERAGE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
metrics.historical_quality_score:
  data_type: INT64
  description: <p>The historical quality score.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.historical_search_predicted_ctr:
  data_type: ENUM
  description: <p>The historical search predicted click through rate (CTR).</p>
  enum_values: ABOVE_AVERAGE, AVERAGE, BELOW_AVERAGE, UNKNOWN, UNSPECIFIED
  filterable: true
  is_repeated: false
  sortable: true
metrics.hotel_average_lead_value_micros:
  data_type: DOUBLE
  description: <p>Average lead value based on clicks.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.hotel_commission_rate_micros:
  data_type: INT64
  description: '<p>Commission bid rate in micros. A 20% commission is represented
