  filterable: true
  is_repeated: false
  sortable: true
user_list.logical_user_list.rules:
  data_type: MESSAGE
  description: <p>Logical list rules that define this user list. The rules are defined
    as a logical operator (ALL/ANY/NONE) and a list of user lists. All the rules are
    ANDed when they are evaluated. Required for creating a logical user list.</p>
  filterable: false
  is_repeated: true
  sortable: false
user_list.lookalike_user_list.country_codes:
  data_type: STRING
