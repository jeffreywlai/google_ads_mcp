    <p>Can be set only when creating campaigns.

    After campaign is created, the field can not be changed.</p>'
  enum_values: APP_CAMPAIGN, APP_CAMPAIGN_FOR_ENGAGEMENT, APP_CAMPAIGN_FOR_PRE_REGISTRATION,
    DISPLAY_EXPRESS, DISPLAY_GMAIL_AD, DISPLAY_MOBILE_APP, DISPLAY_SMART_CAMPAIGN,
    LOCAL_CAMPAIGN, SEARCH_EXPRESS, SEARCH_MOBILE_APP, SHOPPING_COMPARISON_LISTING_ADS,
    SHOPPING_SMART_ADS, SMART_CAMPAIGN, TRAVEL_ACTIVITIES, UNKNOWN, UNSPECIFIED, VIDEO_ACTION,
