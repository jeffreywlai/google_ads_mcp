    times the hotel_commission_rate in advertiser currency.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.hotel_price_difference_percentage:
  data_type: DOUBLE
  description: '<p>The average price difference between the price offered by reporting
    hotel

    advertiser and the cheapest price offered by the competing advertiser.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.impressions:
  data_type: INT64
  description: '<p>Count of how often your ad has appeared on a search results page
    or

    website on the Google Network.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.impressions_margin_of_error:
  data_type: DOUBLE
  description: '<p>The margin of error when estimating the experiment''s effect on
    impressions.</p>

    <p>Together with <code>impressions_point_estimate</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the radius of the

    confidence interval, which is centered at

    <code>impressions_point_estimate</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.impressions_p_value:
  data_type: DOUBLE
  description: '<p>The p-value for the null hypothesis that the experiment has no
    effect on

    impressions. Ranges from 0 to 1.</p>

    <p>Say if the p-value is 0.03, that means the probability of observing the

    data, if the experiment has no effect on impressions, is 3%.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.impressions_point_estimate:
  data_type: DOUBLE
  description: '<p>The point estimate when estimating the experiment''s effect on
    impressions.</p>

    <p>Together with <code>impressions_margin_of_error</code>,

    they describe a confidence interval with a prescribed confidence level

    for the difference being estimated. The quantity being estimated is

    (treatment / control - 1). This field specifies the point estimate, which

    is the center of the confidence interval:

    <code>(impressions_point_estimate - impressions_margin_of_error,

    impressions_point_estimate + impressions_margin_of_error)</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.impressions_unique_query_clusters:
  data_type: INT64
  description: <p>Unique query intent cluster count for impressions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.interaction_event_types:
  data_type: ENUM
  description: <p>The types of payable and free interactions.</p>
  enum_values: CLICK, ENGAGEMENT, NONE, UNKNOWN, UNSPECIFIED, VIDEO_VIEW
  filterable: true
  is_repeated: true
  sortable: false
metrics.interaction_rate:
  data_type: DOUBLE
  description: '<p>How often people interact with your ad after it is shown to them.

    This is the number of interactions divided by the number of times your ad

    is shown.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.interactions:
  data_type: INT64
  description: '<p>The number of interactions.

    An interaction is the main user action associated with an ad format-clicks

    for text and shopping ads, views for video ads, and so on.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.invalid_click_rate:
  data_type: DOUBLE
  description: '<p>The percentage of clicks filtered out of your total number of clicks

    (filtered + non-filtered clicks) during the reporting period.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.invalid_clicks:
  data_type: INT64
  description: <p>Number of clicks Google considers illegitimate and doesn't charge
    you for.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.lead_cost_of_goods_sold_micros:
  data_type: INT64
  description: '<p>Lead cost of goods sold (COGS) is the total cost of products sold
    as a

    result of advertising the same product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with has an associated

    product (see Shopping Ads) then this product is considered the advertised

    product. Any product included in the order the customer places is a sold

    product. If the advertised and sold products match, then the cost of these

    goods is counted under lead cost of goods sold.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat has a cost of goods sold value of $3, the shirt

    has a cost of goods sold value of $5. The lead cost of goods sold for this

    order is $3.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.lead_gross_profit_micros:
  data_type: INT64
  description: '<p>Lead gross profit is the profit you made from products sold as
    a result of

    advertising the same product, minus cost of goods sold (COGS).</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If the advertised and sold products match, then

    the revenue you made from these sales minus the cost of goods sold is your

    lead gross profit.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat is priced $10 and has a cost of goods sold value

    of $3. The lead gross profit of this order is $7 = $10 - $3.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.lead_revenue_micros:
  data_type: INT64
  description: '<p>Lead revenue is the total amount you made from products sold as
    a result of

    advertising the same product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If the advertised and sold products match, then

    the total value you made from the sales of these products is shown under

    lead revenue.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt. The hat is priced $10 and the shirt is priced $20. The

    lead revenue of this order is $10.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.lead_units_sold:
  data_type: DOUBLE
  description: '<p>Lead units sold is the total number of products sold as a result
    of

    advertising the same product.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. If the ad that was interacted with before the purchase has

    an associated product (see Shopping Ads) then this product is considered

    the advertised product. Any product included in the order the customer

    places is a sold product. If the advertised and sold products match, then

    the total number of these products sold is shown under lead units sold.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat, a shirt and a jacket. The lead units sold in this order is 1.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.linked_entities_count:
  data_type: INT64
  description: '<p>Number of linked resources in which the asset is used.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.linked_sample_entities:
  data_type: STRING
  description: '<p>A list of up to 20 sample linked resources in which the asset is
    used.

    This metric can only be selected with <code>ChannelAggregateAssetView</code> and

    <code>CampaignAggregateAssetView</code>.</p>'
  filterable: false
  is_repeated: true
  sortable: false
metrics.mobile_friendly_clicks_percentage:
  data_type: DOUBLE
  description: <p>The percentage of mobile clicks that go to a mobile-friendly page.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.new_customer_lifetime_value:
  data_type: DOUBLE
  description: '<p>New customers'' lifetime conversion value. If you have set up

    customer acquisition goal at either account level or campaign level, this

    will include the additional conversion value from new customers for

    biddable conversions. If your campaign has adopted the customer

    acquisition goal and selected "bid higher for new customers", these values

    will be included in "conversions_value" for optimization. See

    <a href="https://support.google.com/google-ads/answer/12080169">About customer
    lifecycle

    goals</a> for more

    details.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.optimization_score_uplift:
  data_type: DOUBLE
  description: <p>Total optimization score uplift of all recommendations.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.optimization_score_url:
  data_type: STRING
  description: '<p>URL for the optimization score page in the Google Ads web interface.

    This metric can be selected from <code>customer</code> or <code>campaign</code>,
    and can be

    segmented by <code>segments.recommendation_type</code>.</p>

    <p>For example, <code>SELECT metrics.optimization_score_url,

    segments.recommendation_type FROM customer</code> will return a URL for each

    unique (customer, recommendation_type) combination.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.orders:
  data_type: DOUBLE
  description: '<p>Orders is the total number of purchase conversions you received
    attributed

    to your ads.</p>

    <p>How it works: You report conversions with cart data for

    completed purchases on your website. If a conversion is attributed to

    previous interactions with your ads (clicks for text or Shopping ads, views

    for video ads etc.) it''s counted as an order.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat and a shirt in an order on your website. Even though they bought 2

    products, this would count as 1 order.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.organic_clicks:
  data_type: INT64
  description: '<p>The number of times someone clicked your site''s listing in the
    unpaid

    results for a particular query. See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.organic_clicks_per_query:
  data_type: DOUBLE
  description: '<p>The number of times someone clicked your site''s listing in the
    unpaid

    results (organic_clicks) divided by the total number of searches that

    returned pages from your site (organic_queries). See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.organic_impressions:
  data_type: INT64
  description: '<p>The number of listings for your site in the unpaid search results.
    See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.organic_impressions_per_query:
  data_type: DOUBLE
  description: '<p>The number of times a page from your site was listed in the unpaid
    search

    results (<code>organic_impressions</code>) divided by the number of searches returning

    your site''s listing in the unpaid results (<code>organic_queries</code>). See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.organic_queries:
  data_type: INT64
  description: '<p>The total number of searches that returned your site''s listing
    in the

    unpaid results. See

    <a href="https://support.google.com/google-ads/answer/3097241">About measuring
    paid and organic search

    results</a> for details.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.percent_new_visitors:
  data_type: DOUBLE
  description: '<p>Percentage of first-time sessions (from people who had never visited
    your

    site before). Imported from Google Analytics.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.phone_calls:
  data_type: INT64
  description: <p>Number of offline phone calls.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.phone_impressions:
  data_type: INT64
  description: <p>Number of offline phone impressions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.phone_through_rate:
  data_type: DOUBLE
  description: '<p>Number of phone calls received (<code>phone_calls</code>) divided
    by the number of

    times your phone number is shown (<code>phone_impressions</code>).</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions:
  data_type: DOUBLE
  description: '<p>The number of platform comparable conversions. This only includes

    conversion actions for which include_in_conversions_metric attribute is set

    to true. If you use conversion-based bidding, your bid strategies will

    optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The number of platform comparable conversions. When this metric
    is

    segmented by date, the values in the date segment represent the conversion

    date. This only includes conversion actions for which

    include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_from_interactions_rate:
  data_type: DOUBLE
  description: '<p>Platform comparable conversions from interactions divided by the
    number of

    ad interactions (such as clicks for text ads or views for video ads). This

    only includes conversion actions for which include_in_conversions_metric

    attribute is set to true. If you use conversion-based bidding, your bid

    strategies will optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_from_interactions_value_per_interaction:
  data_type: DOUBLE
  description: '<p>The value of platform comparable conversions from interactions
    divided by

    the number of ad interactions. This only includes conversion actions for

    which include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_value:
  data_type: DOUBLE
  description: '<p>The value of platform comparable conversions. This only includes
    conversion

    actions which include_in_conversions_metric attribute is set to true. If

    you use conversion-based bidding, your bid strategies will optimize for

    these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_value_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of platform comparable conversions. When this metric
    is segmented

    by date, the values in the date segment represent the conversion date. This

    only includes conversion actions for which include_in_conversions_metric

    attribute is set to true. If you use conversion-based bidding, your bid

    strategies will optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.platform_comparable_conversions_value_per_cost:
  data_type: DOUBLE
  description: '<p>The value of conversions divided by the cost of ad interactions.
    This only

    includes conversion actions for which include_in_conversions_metric

    attribute is set to true. If you use conversion-based bidding, your bid

    strategies will optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.primary_impressions:
  data_type: INT64
  description: '<p>Primary impression is counted each time your ad is served. This
    metric is

    only available for the Campaign resource with adjusted_age_range and

    adjusted_gender segments. These segmentations are mandatory to get the

    primary impressions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.publisher_organic_clicks:
  data_type: INT64
  description: '<p>Clicks from properties for which the traffic the publisher has
    not paid

    for or acquired through incentivized activity</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.publisher_purchased_clicks:
  data_type: INT64
  description: '<p>Clicks from properties not owned by the publisher for which the
    traffic

    the publisher has paid for or acquired through incentivized activity</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.publisher_unknown_clicks:
  data_type: INT64
  description: '<p>Clicks from traffic which is not identified as "Publisher Purchased"
    or

    "Publisher Organic"</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.relative_ctr:
  data_type: DOUBLE
  description: '<p>Your clickthrough rate (Ctr) divided by the average clickthrough
    rate of

    all advertisers on the websites that show your ads. Measures how your ads

    perform on Display Network sites compared to other ads on the same sites.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.results_conversions_purchase:
  data_type: DOUBLE
  description: <p>The purchase conversion stats for the unified goals results.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.revenue_micros:
  data_type: INT64
  description: '<p>Revenue is the total amount you made from orders attributed to
    your ads.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. Revenue is the total value of all the orders you received

    attributed to your ads, minus any discount.</p>

    <p>Example: Someone clicked on a Shopping ad  for a hat then bought the same

    hat and a shirt in an order from your website. The hat is priced $10 and

    the shirt is priced $20. The entire order has a $5 discount. The revenue

    from this order is $25 = ($10 + $20) - $5.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_absolute_top_impression_share:
  data_type: DOUBLE
  description: '<p>The percentage of the customer''s Shopping or Search ad impressions
    that are

    shown in the most prominent Shopping position. See

    <a href="https://support.google.com/google-ads/answer/7501826">About top and

    absolute top metrics</a></p>

    <p>for details. Any value below 0.1 is reported as 0.0999.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_budget_lost_absolute_top_impression_share:
  data_type: DOUBLE
  description: '<p>The number estimating how often your ad wasn''t the very first
    ad among the

    top ads in the search results due to a low budget.</p>

    <p>Note: Search budget lost absolute top impression share is reported in the

    range of 0 to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_budget_lost_impression_share:
  data_type: DOUBLE
  description: '<p>The estimated percent of times that your ad was eligible to show
    on the

    Search Network but didn''t because your budget was too low.</p>

    <p>Note: Search

    budget lost impression share is reported in the range of 0 to 0.9. Any

    value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_budget_lost_top_impression_share:
  data_type: DOUBLE
  description: '<p>The estimated percent of times that your ad didn''t show adjacent
    to the top

    organic search results due to a low budget.</p>

    <p>Note: Search budget lost top impression share is reported in the range of 0

    to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_click_share:
  data_type: DOUBLE
  description: '<p>The number of clicks you''ve received on the Search Network

    divided by the estimated number of clicks you were eligible to receive.</p>

    <p>Note: Search click share is reported in the range of 0.1 to 1. Any value

    below 0.1 is reported as 0.0999.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_exact_match_impression_share:
  data_type: DOUBLE
  description: '<p>The impressions you''ve received divided by the estimated number
    of

    impressions you were eligible to receive on the Search Network for search

    terms that matched your keywords exactly (or were close variants of your

    keyword), regardless of your keyword match types.</p>

    <p>Note: Search exact match impression share is reported in the range of 0.1

    to 1. Any value below 0.1 is reported as 0.0999.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_impression_share:
  data_type: DOUBLE
  description: '<p>The impressions you''ve received on the Search Network divided

    by the estimated number of impressions you were eligible to receive.</p>

    <p>Note: Search impression share is reported in the range of 0.1 to 1. Any

    value below 0.1 is reported as 0.0999.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_rank_lost_absolute_top_impression_share:
  data_type: DOUBLE
  description: '<p>The number estimating how often your ad wasn''t the very first
    ad among the

    top ads in the search results due to poor Ad Rank.</p>

    <p>Note: Search rank lost absolute top impression share is reported in the

    range of 0 to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_rank_lost_impression_share:
  data_type: DOUBLE
  description: '<p>The estimated percentage of impressions on the Search Network

    that your ads didn''t receive due to poor Ad Rank.

    Note: Search rank lost impression share is reported in the range of 0 to

    0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_rank_lost_top_impression_share:
  data_type: DOUBLE
  description: '<p>The number estimating how often your ad didn''t show adjacent to
    the top

    organic search results due to poor Ad Rank.</p>

    <p>Note: Search rank lost top impression share is reported in the range of 0

    to 0.9. Any value above 0.9 is reported as 0.9001.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_top_impression_share:
  data_type: DOUBLE
  description: '<p>The impressions you''ve received among the top ads compared to
    the estimated

    number of impressions you were eligible to receive among the top ads.

    Note: Search top impression share is reported in the range of 0.1 to 1. Any

    value below 0.1 is reported as 0.0999.</p>

    <p>Top ads are generally above the top organic results, although they may show

    below the top organic results on certain queries.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.search_volume:
  data_type: MESSAGE
  description: <p>Search volume range for a search term insight category.</p>
  filterable: false
  is_repeated: false
  sortable: true
metrics.sk_ad_network_installs:
  data_type: INT64
  description: <p>The number of iOS Store Kit Ad Network conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.sk_ad_network_total_conversions:
  data_type: INT64
  description: <p>The total number of iOS Store Kit Ad Network conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.speed_score:
  data_type: INT64
  description: '<p>A measure of how quickly your page loads after clicks on your mobile
    ads.

    The score is a range from 1 to 10, 10 being the fastest.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.store_visits_last_click_model_attributed_conversions:
  data_type: DOUBLE
  description: <p>The amount of business visits attributed by the last click model.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.svr:
  data_type: INT64
  description: <p>This feature is available to allowlisted accounts only.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.top_impression_percentage:
  data_type: DOUBLE
  description: '<p>The percent of your ad impressions that are shown adjacent to the
    top

    organic search results.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.trueview_average_cpv:
  data_type: DOUBLE
  description: '<p>The average amount you pay each time someone views your ad.

    The average CPV is defined by the total cost of all ad views divided by

    the number of TrueView views.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users:
  data_type: INT64
  description: '<p>The number of unique users who saw your ad during the requested
    time

    period. This metric cannot be aggregated, and can only be requested for

    date ranges of 92 days or less. This metric is available for following

    campaign types - Display, Video, Discovery and App.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users_five_plus:
  data_type: INT64
  description: '<p>This metric counts the unique individuals who were shown your video
    ad five

    or more times within the selected date range. This metric cannot be

    aggregated, and can only be requested for date ranges of 31 days or less.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users_four_plus:
  data_type: INT64
  description: '<p>This metric counts the unique individuals who were shown your video
    ad four

    or more times within the selected date range. This metric cannot be

    aggregated, and can only be requested for date ranges of 31 days or less.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users_ten_plus:
  data_type: INT64
  description: '<p>This metric counts the unique individuals who were shown your video
    ad ten

    or more times within the selected date range. This metric cannot be

    aggregated, and can only be requested for date ranges of 31 days or less.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users_three_plus:
  data_type: INT64
  description: '<p>This metric counts the unique individuals who were shown your video
    ad

    three or more times within the selected date range. This metric cannot be

    aggregated, and can only be requested for date ranges of 31 days or less.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.unique_users_two_plus:
  data_type: INT64
  description: '<p>This metric counts the unique individuals who were shown your video
    ad two

    or more times within the selected date range. This metric cannot be

    aggregated, and can only be requested for date ranges of 31 days or less.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.units_sold:
  data_type: DOUBLE
  description: '<p>Units sold is the total number of products sold from orders attributed
    to

    your ads.</p>

    <p>How it works: You report conversions with cart data for completed purchases

    on your website. Units sold is the total number of products sold from all

    orders attributed to your ads.</p>

    <p>Example: Someone clicked on a Shopping ad for a hat then bought the same

    hat, a shirt and a jacket. The units sold in this order is 3.</p>

    <p>This metric is only available if you report conversions with cart data.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.valid_accelerated_mobile_pages_clicks_percentage:
  data_type: DOUBLE
  description: '<p>The percentage of ad clicks to Accelerated Mobile Pages (AMP) landing
    pages

    that reach a valid AMP page.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_adjustment:
  data_type: DOUBLE
  description: '<p>The conversion value rule adjustment from biddable conversions
    in all

    conversion categories.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_all_conversions:
  data_type: DOUBLE
  description: <p>The value of all conversions divided by the number of all conversions.</p>
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_all_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of all conversions divided by the number of all conversions.
    When

    this column is selected with date, the values in date column means the

    conversion date. Details for the <code>by_conversion_date</code> columns are available

    at <a href="https://support.google.com/google-ads/answer/9549009">Understand conversions
    by time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_conversion:
  data_type: DOUBLE
  description: '<p>The value of conversions divided by the number of conversions.
    This only

    includes conversion actions for which the <code>include_in_conversions_metric</code>

    attribute is set to <code>true</code>. If you use conversion-based bidding, your
    bid

    strategies will optimize for these conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of conversions divided by the number of conversions.
    This only

    includes conversion actions for which the <code>include_in_conversions_metric</code>

    attribute is set to <code>true</code>. If you use conversion-based bidding, your
    bid

    strategies will optimize for these conversions. When this column is

    selected with date, the values in date column means the conversion date.

    Details for the <code>by_conversion_date</code> columns are available at <a href="https://support.google.com/google-ads/answer/9549009">Understand

    conversions by time with new

    columns</a>.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_current_model_attributed_conversion:
  data_type: DOUBLE
  description: '<p>The value of current model attributed conversions divided by the
    number of

    the conversions. This only includes conversion actions for which the

    <code>include_in_conversions_metric</code> attribute is set to <code>true</code>.
    If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_platform_comparable_conversion:
  data_type: DOUBLE
  description: '<p>The value of platform comparable conversions divided by the number
    of

    platform comparable conversions. This only includes conversion actions for

    which include_in_conversions_metric attribute is set to true. If you use

    conversion-based bidding, your bid strategies will optimize for these

    conversions.</p>'
  filterable: true
  is_repeated: false
  sortable: true
metrics.value_per_platform_comparable_conversions_by_conversion_date:
  data_type: DOUBLE
  description: '<p>The value of platform comparable conversions divided by the number
    of

    platform comparable conversions. When this metric is segmented by date, the

    values in the date segment represent the conversion date. This only

    includes conversion actions for which include_in_conversions_metric

