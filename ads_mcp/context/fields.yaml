  description: <p>Output only. The category level 2 of the product.</p>
  filterable: true
  is_repeated: false
  sortable: false
shopping_product.category_level3:
  data_type: RESOURCE_NAME
  description: <p>Output only. The category level 3 of the product.</p>
  filterable: true
  is_repeated: false
  sortable: false
shopping_product.category_level4:
  data_type: RESOURCE_NAME
  description: <p>Output only. The category level 4 of the product.</p>
  filterable: true
  is_repeated: false
  sortable: false
