  sortable: true
campaign.advertising_channel_type:
  data_type: ENUM
  description: '<p>Immutable. The primary serving target for ads within the campaign.

    The targeting options can be refined in <code>network_settings</code>.</p>

    <p>This field is required and should not be empty when creating new

    campaigns.</p>

    <p>Can be set only when creating campaigns.

    After the campaign is created, the field can not be changed.</p>'
  enum_values: DEMAND_GEN, DISPLAY, HOTEL, LOCAL, LOCAL_SERVICES, MULTI_CHANNEL, PERFORMANCE_MAX,
    SEARCH, SHOPPING, SMART, TRAVEL, UNKNOWN, UNSPECIFIED, VIDEO
