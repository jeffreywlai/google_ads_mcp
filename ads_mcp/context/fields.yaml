    Read

    only.</p>'
  filterable: true
  is_repeated: false
  sortable: true
shared_set.name:
  data_type: STRING
  description: '<p>The name of this shared set. Required.

    Shared Sets must have names that are unique among active shared sets of

    the same type.

    The length of this string should be between 1 and 255 UTF-8 bytes,

    inclusive.</p>'
  filterable: true
  is_repeated: false
  sortable: true
shared_set.reference_count:
