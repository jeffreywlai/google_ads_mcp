display_name: Customer Search Term Insight
name: customer_search_term_insight
description: '<p>This report provides a high-level view of search demand at the customer

  level by grouping similar search terms into categories and showing their

  search volume.

  Historical data is available starting March 2023.</p>'
attributed_views: []
attributes:
- customer_search_term_insight.category_label
- customer_search_term_insight.id
- customer_search_term_insight.resource_name
segments:
- segments.campaign
- segments.date
- segments.search_subcategory
- segments.search_term
metrics:
- metrics.clicks
- metrics.conversions
- metrics.conversions_from_interactions_rate
- metrics.conversions_value
- metrics.ctr
- metrics.impressions
- metrics.search_volume
