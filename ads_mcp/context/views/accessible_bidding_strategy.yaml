display_name: Accessible Bidding Strategy
name: accessible_bidding_strategy
description: '<p>Represents a view of BiddingStrategies owned by and shared with the
  customer.</p>

  <p>In contrast to BiddingStrategy, this resource includes strategies owned by

  managers of the customer and shared with this customer - in addition to

  strategies owned by this customer. This resource does not provide metrics and

  only exposes a limited subset of the BiddingStrategy attributes.</p>'
