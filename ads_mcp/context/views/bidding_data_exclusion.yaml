display_name: Bidding Data Exclusion
name: bidding_data_exclusion
description: '<p>Represents a bidding data exclusion. Bidding data exclusions can
  be set in

  client accounts only, and cannot be used in manager accounts.</p>

  <p>See "About data exclusions" at

  <a href="https://support.google.com/google-ads/answer/10370710">https://support.google.com/google-ads/answer/10370710</a>.</p>

  <p>Note: A customer account can have a maximum of 500 active bidding data

  exclusions.</p>'
