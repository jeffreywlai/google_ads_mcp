display_name: Asset
name: asset
description: '<p>Asset is a part of an ad which can be shared across multiple ads.

  It can be an image (ImageAsset), a video (YoutubeVideoAsset), etc.

  Assets are immutable and cannot be removed. To stop an asset from serving,

  remove the asset from the entity that is using it.</p>'
