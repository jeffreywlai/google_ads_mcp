display_name: Account Budget Proposal
name: account_budget_proposal
description: '<p>An account-level budget proposal.</p>

  <p>All fields prefixed with ''proposed'' may not necessarily be applied directly.

  For example, proposed spending limits may be adjusted before their

  application.  This is true if the ''proposed'' field has an ''approved''

  counterpart, for example, spending limits.</p>

  <p>Note that the proposal type (proposal_type) changes which fields are

  required and which must remain empty.</p>'
