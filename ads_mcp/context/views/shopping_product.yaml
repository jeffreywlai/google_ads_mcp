display_name: Shopping Product
name: shopping_product
description: '<p>A shopping product from Google Merchant Center that can be advertised
  by

  campaigns.</p>

  <p>The resource returns currently existing products from Google Merchant Center

  accounts linked with the customer. A campaign includes a product by

  specifying its merchant id (or, if available, the Multi Client Account id of

  the merchant) in the <code>ShoppingSetting</code>, and can limit the inclusion to

  products having a specified feed label. Standard Shopping campaigns can also

  limit the inclusion through a <code>campaign_criterion.listing_scope</code>.</p>

  <p>Queries to this resource specify a scope:</p>

  <ul>

  <li>Account:</li>

  <li>Filters on campaigns or ad groups are not specified.</li>

  <li>

  <p>All products from the linked Google Merchant Center accounts are

  returned.</p>

  </li>

  <li>

  <p>Metrics and some fields (see the per-field documentation) are aggregated

  across all Shopping and Performance Max campaigns that include a product.</p>

  </li>

  <li>

  <p>Campaign:</p>

  </li>

  <li>

  <p>An equality filter on <code>campaign</code> is specified. Supported campaign
  types

  are Shopping, Performance Max, Demand Gen, Video, App.</p>

  </li>

  <li>

  <p>Only products that are included by the specified campaign are returned.</p>

  </li>

  <li>

  <p>Metrics and some fields (see the per-field documentation) are restricted

  to the specified campaign.</p>

  </li>

  <li>

  <p>Only the following metrics are supported for Demand Gen, Video, App

  campaigns: impressions, clicks, ctr.</p>

  </li>

  <li>

  <p>Ad group:</p>

  </li>

  <li>

  <p>An equality filter on <code>ad_group</code> and <code>campaign</code> is specified.
  Supported

  campaign types are Shopping, Demand Gen, Video, App.</p>

  </li>

  <li>

  <p>Only products that are included by the specified campaign are returned.</p>

  </li>

  <li>

  <p>Metrics and some fields (see the per-field documentation) are restricted

  to the specified ad group.</p>

  </li>

  <li>

  <p>Only the following metrics are supported for Demand Gen, Video, App

  campaigns: impressions, clicks, ctr.</p>

  </li>

  </ul>

  <p>Note that segmentation by date segments is not permitted and will return

  UNSUPPORTED_DATE_SEGMENTATION error. On the other hand, filtering on date

  segments is allowed.</p>'
