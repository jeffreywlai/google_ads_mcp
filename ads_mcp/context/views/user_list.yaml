display_name: User List
name: user_list
description: '<p>A user list. This is a list of users a customer may target.

  The unique key of a user list consists of the following fields: <code>id</code>.

  Note that the <code>name</code> must also be unique for user lists owned

  by a given customer, except in some cases where

  <code>access_reason</code> is set to <code>SHARED</code>. Violating the unique name
  constraint

  produces error: <code>UserListError.INVALID_NAME</code>.</p>'
